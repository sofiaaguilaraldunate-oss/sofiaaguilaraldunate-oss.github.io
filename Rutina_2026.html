<title>FORJA — Entrenador de fuerza e hipertrofia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B0E13;
  --panel:#141A22;
  --panel2:#1B232D;
  --line:#26313F;
  --txt:#E9EEF5;
  --muted:#8A99AC;
  --cobalt:#4C6FFF;
  --amber:#FFB020;
  --mint:#35D6A4;
  --rose:#FF5C7A;
  --violet:#A24CFF;
  --r:14px;
  --disp:'Bricolage Grotesque',system-ui,sans-serif;
  --body:'Inter',system-ui,-apple-system,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--txt);
  font-family:var(--body);
  font-size:15px;
  line-height:1.5;
  padding-bottom:76px;
  background-image:linear-gradient(rgba(76,111,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(76,111,255,.045) 1px,transparent 1px);
  background-size:44px 44px;
}
h1,h2,h3,h4{font-family:var(--disp);font-weight:800;letter-spacing:-.02em;margin:0}
h1{font-size:26px}
h2{font-size:19px}
h3{font-size:16px}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:var(--cobalt)}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)}
.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}

/* layout */
.app{display:flex;min-height:100vh}
.rail{display:none}
main{flex:1;min-width:0;max-width:1180px;margin:0 auto;padding:18px 16px 40px;width:100%}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:10px}
.mark{width:30px;height:30px;border-radius:9px;background:linear-gradient(150deg,var(--cobalt),var(--violet));display:grid;place-items:center;font-family:var(--disp);font-weight:800;font-size:15px;color:#fff}
.viewtitle{display:flex;flex-direction:column;gap:2px;margin-bottom:16px}

/* cards */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card+.card{margin-top:12px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(2,minmax(0,1fr))}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.wrap{flex-wrap:wrap}
.sp8{height:8px}.sp16{height:16px}.sp24{height:24px}

/* buttons */
.btn{background:var(--panel2);border:1px solid var(--line);color:var(--txt);padding:9px 14px;border-radius:10px;font-weight:600;font-size:14px;transition:.15s;display:inline-flex;align-items:center;gap:7px;justify-content:center}
.btn:hover{border-color:#3A4A5E;background:#212B37}
.btn.pri{background:var(--cobalt);border-color:var(--cobalt);color:#fff}
.btn.pri:hover{background:#3C5EF0}
.btn.ok{background:transparent;border-color:var(--mint);color:var(--mint)}
.btn.dg{border-color:transparent;color:var(--rose)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn.blk{width:100%}
.btn:focus-visible,.chip:focus-visible,.tab:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.icobtn{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);display:grid;place-items:center;color:var(--muted);font-size:14px}
.icobtn:hover{color:var(--txt)}

/* chips / tags */
.chip{border:1px solid var(--line);background:transparent;color:var(--muted);padding:6px 11px;border-radius:999px;font-size:12.5px;font-weight:600;white-space:nowrap}
.chip.on{background:var(--cobalt);border-color:var(--cobalt);color:#fff}
.chiprow{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chiprow::-webkit-scrollbar{display:none}
.tag{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;padding:3px 7px;border-radius:5px;background:var(--panel2);color:var(--muted);border:1px solid var(--line)}
.tag.multi{color:#9DB4FF;border-color:#2D3E68;background:#182136}
.tag.acc{color:var(--amber);border-color:#4A3A18;background:#241E10}
.tag.iso{color:var(--mint);border-color:#1D473A;background:#10241E}

/* inputs */
input,select,textarea{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:9px 10px;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--cobalt);outline:none}
label.f{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:500}
.field{margin-bottom:12px}

/* nav */
.tabbar{position:fixed;bottom:0;left:0;right:0;background:rgba(11,14,19,.94);backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;z-index:40;padding-bottom:env(safe-area-inset-bottom)}
.tab{flex:1;padding:9px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:10px;font-weight:600}
.tab svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--cobalt)}

/* stat */
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat .v{font-family:var(--mono);font-size:22px;font-weight:700;letter-spacing:-.03em;line-height:1.1}
.stat .l{font-size:11px;color:var(--muted);margin-top:3px}

/* exercise rows */
.exrow{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.exrow:last-child{border-bottom:none}
.idx{width:26px;height:26px;flex:none;border-radius:8px;background:var(--panel2);border:1px solid var(--line);display:grid;place-items:center;font-family:var(--mono);font-size:11px;color:var(--muted)}
.exname{font-weight:600;font-size:14.5px;line-height:1.25}
.exmeta{font-size:11.5px;color:var(--muted);margin-top:3px;font-family:var(--mono)}

/* bars */
.bar{height:7px;border-radius:4px;background:var(--panel2);overflow:hidden;position:relative}
.bar>i{display:block;height:100%;border-radius:4px}

/* modal */
.sheet{position:fixed;inset:0;background:rgba(4,6,10,.72);z-index:60;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:.2s}
.sheet.on{opacity:1;pointer-events:auto}
.sheetbox{background:var(--panel);border:1px solid var(--line);border-radius:20px 20px 0 0;width:100%;max-width:680px;max-height:92vh;overflow-y:auto;padding:8px 16px 28px;transform:translateY(20px);transition:.2s}
.sheet.on .sheetbox{transform:none}
.grab{width:38px;height:4px;border-radius:3px;background:var(--line);margin:8px auto 14px}
.sheethead{position:sticky;top:0;background:var(--panel);padding-bottom:10px;z-index:2}

/* set logging table */
.setgrid{display:grid;grid-template-columns:26px 1fr 1fr 56px 34px;gap:6px;align-items:center;margin-bottom:6px}
.setgrid input{padding:8px 6px;text-align:center;font-family:var(--mono);font-weight:700}
.setgrid .hd{font-size:10px;color:var(--muted);text-align:center;font-family:var(--mono);letter-spacing:.08em;text-transform:uppercase}
.setdone{background:#10241E;border-color:#1D473A}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .dow{font-size:10px;color:var(--muted);text-align:center;font-family:var(--mono);text-transform:uppercase}
.day{aspect-ratio:1;border-radius:9px;border:1px solid var(--line);background:var(--panel2);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--mono);font-size:12px;position:relative;color:var(--muted)}
.day.done{background:#152B3F;border-color:var(--cobalt);color:#fff}
.day.plan{border-style:dashed;border-color:#3A4A5E}
.day.today{box-shadow:0 0 0 2px var(--amber) inset;color:var(--txt)}
.day .dot{position:absolute;bottom:5px;width:5px;height:5px;border-radius:50%}
.day .pr{position:absolute;top:3px;right:4px;font-size:8px;color:var(--amber)}

/* body map */
.bodywrap{display:flex;gap:6px;justify-content:center}
.bodywrap svg{width:100%;max-width:170px;height:auto}
.bodywrap path,.bodywrap ellipse,.bodywrap rect{transition:fill .3s}
.silhouette{fill:#141A22;stroke:#26313F;stroke-width:1.2}

/* misc */
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:5px 10px;border-radius:999px;font-weight:600}
.pill.up{background:#10241E;color:var(--mint)}
.pill.hold{background:#241E10;color:var(--amber)}
.pill.down{background:#2A1620;color:var(--rose)}
.note{border-left:2px solid var(--cobalt);padding:2px 0 2px 11px;color:var(--muted);font-size:13px}
.empty{text-align:center;padding:34px 16px;color:var(--muted)}
.empty h3{color:var(--txt);margin-bottom:6px}
ol.steps{margin:0;padding-left:18px}
ol.steps li{margin-bottom:7px;font-size:13.5px}
ul.dots{margin:0;padding-left:16px}
ul.dots li{margin-bottom:5px;font-size:13.5px}
.divider{height:1px;background:var(--line);margin:16px 0}
.toast{position:fixed;bottom:88px;left:50%;transform:translateX(-50%) translateY(10px);background:var(--panel2);border:1px solid var(--line);padding:11px 18px;border-radius:12px;z-index:80;opacity:0;transition:.25s;font-weight:600;font-size:14px;box-shadow:0 12px 30px rgba(0,0,0,.5);max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}
.timerbar{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;background:var(--cobalt);color:#fff;padding:10px 16px;border-radius:12px;z-index:50;font-family:var(--mono);font-weight:700;display:none;align-items:center;gap:12px;box-shadow:0 10px 26px rgba(76,111,255,.35)}
.timerbar.on{display:flex}
.scrollx{overflow-x:auto;scrollbar-width:thin}
table.data{width:100%;border-collapse:collapse;font-size:13px}
table.data th{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);font-weight:500}
table.data td{padding:8px;border-bottom:1px solid var(--line)}
table.data tr:last-child td{border-bottom:none}

@media(min-width:860px){
  body{padding-bottom:0}
  .tabbar{display:none}
  .rail{display:flex;flex-direction:column;gap:3px;width:212px;flex:none;padding:20px 12px;border-right:1px solid var(--line);position:sticky;top:0;height:100vh;background:rgba(20,26,34,.5)}
  .rail .tab{flex-direction:row;justify-content:flex-start;gap:11px;padding:10px 12px;border-radius:10px;font-size:14px}
  .rail .tab.on{background:var(--panel2);color:var(--txt)}
  .rail .tab.on svg{color:var(--cobalt)}
  main{padding:26px 30px 60px}
  .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
  .sheet{align-items:center}
  .sheetbox{border-radius:18px;max-height:86vh}
  h1{font-size:32px}
  .timerbar{bottom:26px;left:auto;right:26px;transform:none}
  .toast{bottom:26px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- v2: ejecución de la rutina ---------- */
.exbig{display:flex;gap:12px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--line)}
.exbig:last-child{border-bottom:0}
.mini{width:46px;flex:0 0 46px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:3px;display:flex;align-items:center;justify-content:center}
.mini svg{width:100%;height:auto;display:block}
.mini.lg{width:62px;flex-basis:62px}
.mus{display:flex;flex-wrap:wrap;gap:5px;margin:5px 0 4px}
.mus span{font-size:10.5px;padding:2px 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted);font-weight:600}
.mus span.p1{color:var(--cobalt);border-color:#2A3A6B;background:#141C2E}
.cue{font-size:12.5px;color:var(--muted);line-height:1.45;margin-top:3px}
.prog{height:6px;border-radius:99px;background:var(--panel2);overflow:hidden;border:1px solid var(--line)}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--cobalt),var(--mint));transition:width .25s}
.tick{width:30px;height:30px;flex:0 0 30px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);color:var(--muted);font-size:14px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.tick.on{background:#12362B;border-color:#1D473A;color:var(--mint)}
.exdone{opacity:.62;cursor:pointer}
.exdone .exname{text-decoration:line-through;text-decoration-color:var(--line)}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wk button{border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:7px 2px;color:var(--muted);font-size:11px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer}
.wk button b{font-family:var(--mono);font-size:13px;color:var(--txt);font-weight:800}
.wk button.done{border-color:var(--cobalt);background:#141C2E;color:var(--cobalt)}
.wk button.plan{border-style:dashed}
.wk button.hoy{box-shadow:0 0 0 1px var(--cobalt) inset}
.hist{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.hist span{font-family:var(--mono);font-size:11.5px;color:var(--muted);border:1px solid var(--line);border-radius:8px;padding:4px 8px}
.hist span.best{color:var(--amber);border-color:#4A3A18}
.hist span.now{color:var(--mint);border-color:#1D473A}
.eqgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.eqgrid button{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel2);color:var(--muted);border-radius:10px;padding:10px;font-size:13px;font-weight:600;text-align:left;cursor:pointer}
.eqgrid button.on{border-color:var(--cobalt);background:#141C2E;color:var(--txt)}
.eqgrid button i{width:16px;height:16px;border-radius:5px;border:1px solid var(--line);flex:0 0 16px;font-style:normal;font-size:11px;display:flex;align-items:center;justify-content:center}
.eqgrid button.on i{background:var(--cobalt);border-color:var(--cobalt);color:#fff}
.setgrid.rpe{grid-template-columns:22px 1fr 1fr 46px 46px 32px}
@media(max-width:420px){.setgrid.rpe{grid-template-columns:20px 1fr 1fr 40px 40px 30px;gap:4px}}
</style>
</head>
<body>
<div class="app">
  <nav class="rail" id="rail"></nav>
  <main id="main"></main>
</div>
<nav class="tabbar" id="tabbar"></nav>
<div class="sheet" id="sheet"><div class="sheetbox" id="sheetbox"></div></div>
<div class="toast" id="toast"></div>
<div class="timerbar" id="timerbar"><span id="timertxt">02:00</span><button class="btn sm" onclick="Timer.add(30)">+30s</button><button class="btn sm" onclick="Timer.stop()">Listo</button></div>
<script>
/* ===================== TAXONOMÍA MUSCULAR ===================== */
const MUSC = {
  cuad:{n:'Cuádriceps',z:'Pierna',v:'f',mev:8,mav:18,mrv:26},
  glut:{n:'Glúteos',z:'Pierna',v:'b',mev:8,mav:20,mrv:30},
  isq:{n:'Isquiosurales',z:'Pierna',v:'b',mev:6,mav:16,mrv:24},
  adu:{n:'Aductores',z:'Pierna',v:'f',mev:4,mav:10,mrv:16},
  abd:{n:'Abductores',z:'Pierna',v:'b',mev:4,mav:12,mrv:20},
  gem:{n:'Gemelos y sóleo',z:'Pierna',v:'b',mev:6,mav:14,mrv:20},
  dor:{n:'Dorsal ancho',z:'Espalda',v:'b',mev:10,mav:18,mrv:25},
  rom:{n:'Romboides y trapecio medio',z:'Espalda',v:'b',mev:6,mav:14,mrv:22},
  tra:{n:'Trapecio superior',z:'Espalda',v:'b',mev:4,mav:12,mrv:20},
  lum:{n:'Erectores lumbares',z:'Espalda',v:'b',mev:4,mav:10,mrv:14},
  dan:{n:'Deltoides anterior',z:'Hombro',v:'f',mev:4,mav:12,mrv:18},
  dla:{n:'Deltoides lateral',z:'Hombro',v:'f',mev:8,mav:18,mrv:26},
  dpo:{n:'Deltoides posterior',z:'Hombro',v:'b',mev:6,mav:14,mrv:22},
  pec:{n:'Pectoral mayor',z:'Pecho',v:'f',mev:8,mav:16,mrv:22},
  pes:{n:'Pectoral superior',z:'Pecho',v:'f',mev:6,mav:14,mrv:20},

/* ===================== ALMACENAMIENTO ===================== */
const KEY='forja:v1';
/* Guardado en cascada: almacenamiento de la app → almacenamiento del navegador → memoria.
   Se registra cuál está activo para poder avisar al usuario con honestidad. */
const Store={
  mem:null, modo:'memoria', ultimo:null,
  _ls(){ try{ return (typeof localStorage!=='undefined'&&localStorage)?localStorage:null; }catch(e){ return null; } },
  async load(){
    try{ if(window.storage){const r=await window.storage.get(KEY);
      if(r&&r.value){this.modo='app';return JSON.parse(r.value);} this.modo='app';return null;} }catch(e){}
    const ls=this._ls();
    if(ls){ try{ const v=ls.getItem(KEY); this.modo='navegador'; if(v)return JSON.parse(v); }catch(e){} }
    return null;
  },
  async save(data){
    this.mem=data;
    const txt=JSON.stringify(data);
    try{ if(window.storage){await window.storage.set(KEY,txt);this.modo='app';this.ultimo=Date.now();return true;} }catch(e){}
    const ls=this._ls();
    if(ls){ try{ ls.setItem(KEY,txt);this.modo='navegador';this.ultimo=Date.now();return true; }catch(e){} }
    this.modo='memoria';this.ultimo=Date.now();
    return false;
  },
  estado(){
    if(this.modo==='app')return{ok:true,t:'Guardado permanente activo',d:'Tus entrenamientos se guardan solos y siguen aquí la próxima vez que abras la aplicación.'};
    if(this.modo==='navegador')return{ok:true,t:'Guardado en este navegador',d:'Los datos quedan en este dispositivo y navegador. Se mantienen al cerrar y al recargar, pero se pierden si borras los datos de navegación o abres el archivo desde otro dispositivo. Exporta una copia de vez en cuando.'};
    return{ok:false,t:'Sin guardado permanente',d:'Este entorno no permite almacenar datos. Todo lo que registres se pierde al recargar o cerrar. Exporta tus datos antes de salir y vuelve a importarlos al empezar.'};
  }
};

/* ===================== ESTADO ===================== */
let S={};
function nuevoEstado(){
  return{v:1,
    perfil:{nombre:'',nivel:2,peso:65,objetivo:'Hipertrofia con énfasis en glúteos y piernas'},
    ajustes:{modo:'gym',incSup:2.5,incInf:5,avisos:true,equipo:equipoDefecto(),rpe:false},
    plan:clonarPlantilla('gluteos5'),
    logs:[],activa:null,deloads:[],medidas:[],
    bib:{rutinas:[],dias:[]},asignaciones:{}
  };
}
function clonarPlantilla(k){
  const t=PLANTILLAS[k];
  return{clave:k,nombre:t.nombre,obj:t.obj,creada:hoyISO(),
    dias:t.dias.map(x=>({id:uid(),nombre:x.nombre,foco:x.foco,dow:x.dow,ejercicios:x.ejercicios.map(e=>({...e,uid:uid()}))}))};
}
async function guardar(){await Store.save(S);}

/* ===================== SUSTITUCIÓN CASA / GIMNASIO ===================== */
function cadenaCasa(id){
  const e=EXI[id];if(!e)return[];
  const out=[];const seen=new Set([id]);
  let cur=e;
  while(cur&&cur.h&&cur.h.length){
    const nx=cur.h.find(h=>!seen.has(h));
    if(!nx)break;seen.add(nx);out.push(nx);cur=EXI[nx];
  }
  return out;
}
function equivalenteCasa(id){
  const e=EXI[id];if(!e)return id;
  if(e.loc==='casa'||e.loc==='both')return id;
  const c=cadenaCasa(id);
  return c.length?c[0]:sugerirPorMusculo(id);
}
function sugerirPorMusculo(id){
  const e=EXI[id];if(!e)return id;
  const cand=EX.filter(x=>x.loc!=='gym'&&x.i!==id&&x.p[0]===e.p[0]);
  if(!cand.length)return id;
  cand.sort((a,b)=>Math.abs(a.d-e.d)-Math.abs(b.d-e.d));
  return cand[0].i;
}
function planEnModo(plan,modo){
  if(modo!=='casa')return plan;
  return{...plan,dias:plan.dias.map(dd=>({...dd,ejercicios:dd.ejercicios.map(x=>({...x,ex:equivalenteCasa(x.ex)}))}))};
}
function diaVisible(dia){
  if(S.ajustes.modo!=='casa')return dia;
  return{...dia,ejercicios:dia.ejercicios.map(x=>({...x,ex:equivalenteCasa(x.ex),_orig:x.ex}))};
}

/* ===================== ORDEN CIENTÍFICO ===================== */
const ORDEN={multi:0,acc:1,iso:2};
function ordenCorrecto(lista){
  let last=-1;
  for(const it of lista){const e=EXI[it.ex];if(!e)continue;const o=ORDEN[e.t];if(o<last)return false;last=Math.max(last,o);}
  return true;
}
function reordenar(lista){
  return [...lista].sort((a,b)=>{
    const ea=EXI[a.ex],eb=EXI[b.ex];
    if(!ea||!eb)return 0;
    if(ORDEN[ea.t]!==ORDEN[eb.t])return ORDEN[ea.t]-ORDEN[eb.t];
    return eb.d-ea.d;
  });
}

/* ===================== HISTORIAL Y PROGRESIÓN ===================== */
function historial(exId){
  const out=[];
  S.logs.forEach(l=>{
    (l.ejercicios||[]).forEach(en=>{
      if(en.ex!==exId)return;
      const sets=(en.sets||[]).filter(s=>s.kg>0||s.reps>0);
      if(!sets.length)return;
      const top=sets.reduce((a,b)=>e1rm(b.kg,b.reps)>e1rm(a.kg,a.reps)?b:a,sets[0]);
      out.push({fecha:l.fecha,sets,top,e1rm:e1rm(top.kg,top.reps),
        vol:sets.reduce((a,s)=>a+s.kg*s.reps,0),notas:en.notas||''});
    });
  });
  return out.sort((a,b)=>a.fecha<b.fecha?-1:1);
}
function record(exId){
  const h=historial(exId);if(!h.length)return null;
  const pe=h.reduce((a,b)=>b.e1rm>a.e1rm?b:a);
  const pk=h.reduce((a,b)=>b.top.kg>a.top.kg?b:a);
  return{e1rm:pe.e1rm,fechaE:pe.fecha,kg:pk.top.kg,reps:pk.top.reps,fechaK:pk.fecha,vol:Math.max(...h.map(x=>x.vol))};
}
/* Motor de progresión: doble progresión con control de fallos consecutivos */
function sugerencia(item){
  const e=EXI[item.ex];if(!e)return null;
  const h=historial(item.ex);
  const inc=['Pierna','Espalda'].includes(MUSC[e.p[0]].z)?S.ajustes.incInf:S.ajustes.incSup;
  if(!h.length)return{tipo:'nuevo',kg:null,txt:'Primera vez: busca un peso donde te queden 2 repeticiones en reserva.'};
  const u=h[h.length-1];
  const kg=u.top.kg;
  const objetivo=item.repMax;
  const completadas=u.sets.filter(s=>s.reps>=objetivo).length;
  const rirMedio=u.sets.filter(s=>s.rir!=null&&s.rir!=='').reduce((a,s,_,arr)=>a+num(s.rir)/arr.length,0);
  const fallos=(()=>{let c=0;for(let i=h.length-1;i>=0;i--){if(h[i].sets.every(s=>s.reps<item.repMin))c++;else break;}return c;})();
  if(fallos>=3)return{tipo:'bajar',kg:round(kg*0.9,1),txt:`Tres sesiones seguidas por debajo de ${item.repMin} repeticiones. Baja un 10% y reconstruye.`};
  if(completadas>=Math.max(1,item.series-1)&&(rirMedio>=1||!rirMedio))
    return{tipo:'subir',kg:round(kg+inc,1),txt:`Completaste el rango con margen. Sube a ${round(kg+inc,1)} kg y vuelve a la parte baja del rango.`};
  if(u.sets.some(s=>s.reps<item.repMin))
    return{tipo:'mantener',kg,txt:`Repite ${kg} kg hasta alcanzar ${item.repMin} repeticiones en todas las series.`};
  return{tipo:'mantener',kg,txt:`Mantén ${kg} kg y busca sumar una repetición por serie.`};
}

/* ===================== ANÁLISIS DE VOLUMEN ===================== */
function semanaDe(iso){
  const dd=parseISO(iso);const day=(dd.getDay()+6)%7;
  const lun=new Date(dd);lun.setDate(dd.getDate()-day);return dISO(lun);
}
/* Ponderación: el músculo primario principal recibe la serie completa,
   el resto de primarios media serie y los secundarios un cuarto. */
function repartir(acc,e,n){
  e.p.forEach((m,i)=>acc[m]=(acc[m]||0)+n*(i===0?1:0.5));
  (e.s||[]).forEach(m=>acc[m]=(acc[m]||0)+n*0.25);
}
function seriesPorMusculo(logs){
  const acc={};
  logs.forEach(l=>(l.ejercicios||[]).forEach(en=>{
    const e=EXI[en.ex];if(!e)return;
    const n=(en.sets||[]).filter(s=>s.reps>0).length;if(!n)return;
    repartir(acc,e,n);
  }));
  return acc;
}
function frecuenciaPorMusculo(logs){
  const acc={};
  logs.forEach(l=>{
    const set=new Set();
    (l.ejercicios||[]).forEach(en=>{const e=EXI[en.ex];if(!e)return;
      if((en.sets||[]).some(s=>s.reps>0))e.p.forEach(m=>set.add(m));});
    set.forEach(m=>acc[m]=(acc[m]||0)+1);
  });
  return acc;
}
/* El pectoral se evalúa como un solo músculo aunque se registre por porciones */
function agr(v,m){return m==='pec'?((v.pec||0)+(v.pes||0)+(v.pei||0)):(v[m]||0);}
function logsEntre(desde,hasta){return S.logs.filter(l=>l.fecha>=desde&&l.fecha<=hasta);}
function ultimosDias(n){const f=new Date();f.setDate(f.getDate()-(n-1));return logsEntre(dISO(f),hoyISO());}
function tonelaje(l){return (l.ejercicios||[]).reduce((a,en)=>a+(en.sets||[]).reduce((x,s)=>x+num(s.kg)*num(s.reps),0),0);}
function seriesTotales(l){return (l.ejercicios||[]).reduce((a,en)=>a+(en.sets||[]).filter(s=>s.reps>0).length,0);}

/* Volumen planificado semanal según el plan actual */
function volumenPlanificado(){
  const acc={};
  S.plan.dias.forEach(dd=>dd.ejercicios.forEach(it=>{
    const e=EXI[it.ex];if(!e)return;
    repartir(acc,e,it.series);
  }));
  return acc;
}

/* ===================== ENTRENADOR: ANÁLISIS ===================== */
function analisis(){
  const av=[];
  const sem=ultimosDias(7),mes=ultimosDias(28);
  const vol=seriesPorMusculo(sem),freq=frecuenciaPorMusculo(sem);
  const plan=volumenPlanificado();
  // 1. volumen semanal por músculo (real si hay datos, planificado si no)
  const base=Object.keys(vol).length?vol:plan;
  const usaPlan=!Object.keys(vol).length;
  Object.keys(MUSC).filter(m=>m!=='pes'&&m!=='pei').forEach(m=>{
    const v=Math.round(agr(base,m)),L=MUSC[m];
    if(v>L.mrv)av.push({t:'alerta',m,txt:`${L.n}: ${v} series ${usaPlan?'planificadas':'esta semana'}, por encima del máximo recuperable (${L.mrv}). Recorta 3-5 series o programa una descarga.`});
    else if(v>0&&v<L.mev*0.8&&['glut','cuad','isq','dor','pec','dla'].includes(m))av.push({t:'aviso',m,txt:`${L.n}: solo ${v} series. El mínimo para crecer ronda ${L.mev}. Añade 1-2 ejercicios o una serie por ejercicio.`});
  });
  // 2. frecuencia
  ['glut','cuad','isq','dor','pec','dla'].forEach(m=>{
    const v=Math.round(agr(base,m));
    if(v>=MUSC[m].mev&&(freq[m]||0)<2&&!usaPlan)
      av.push({t:'aviso',m,txt:`${MUSC[m].n} se entrena ${freq[m]||0} vez por semana. Repartir el mismo volumen en dos sesiones mejora la síntesis proteica.`});
  });
  // 3. equilibrio quad/isquio y empuje/tirón
  const q=agr(base,'cuad'),i=agr(base,'isq');
  if(q>0&&i>0&&q/i>2.5)av.push({t:'aviso',m:'isq',txt:`Ratio cuádriceps/isquios de ${round(q/i,1)}:1. Por encima de 2:1 aumenta el riesgo de lesión de isquios. Suma curl femoral o rumano.`});
  const emp=agr(base,'pec')+(base.dan||0),tir=(base.dor||0)+(base.rom||0);
  if(emp>0&&tir>0&&emp/tir>1.3)av.push({t:'aviso',m:'rom',txt:`Empujas ${round(emp/tir,1)} veces más de lo que tiras. Igualar el volumen de espalda protege el hombro y mejora la postura.`});
  if(base.dpo!==undefined&&(base.dpo||0)<4&&(base.dla||0)>8)av.push({t:'aviso',m:'dpo',txt:'El deltoides posterior recibe poco volumen frente al lateral. Añade pájaros o face pull.'});
  // 4. estancamientos
  const vistos=new Set();
  S.plan.dias.forEach(dd=>dd.ejercicios.forEach(it=>{
    if(vistos.has(it.ex))return;vistos.add(it.ex);
    const h=historial(it.ex);
    if(h.length>=3){
      const u=h.slice(-3);
      if(u[2].e1rm<=u[0].e1rm*1.005&&u[2].e1rm>0)
        av.push({t:'estanco',m:EXI[it.ex]?.p[0],txt:`${EXI[it.ex]?.n}: sin progreso en las últimas 3 sesiones. Cambia el rango de repeticiones, varía el ejercicio o revisa descanso y comida.`});
    }
  }));
  // 5. fatiga y descarga
  const ult=S.logs.slice(-5);
  const fat=ult.filter(l=>l.fatiga).map(l=>num(l.fatiga));
  if(fat.length>=3&&fat.reduce((a,b)=>a+b,0)/fat.length>=7.5)
    av.push({t:'alerta',m:null,txt:'Fatiga percibida media por encima de 7,5 en las últimas sesiones. Programa una semana de descarga: mismo peso, la mitad de series.'});
  const dolor=S.logs.slice(-6).filter(l=>l.dolor&&num(l.dolor)>=6);
  if(dolor.length>=2)av.push({t:'alerta',m:null,txt:'Has registrado dolor articular alto en varias sesiones. Sustituye el ejercicio implicado por una variante sin dolor antes de forzar.'});
  const sd=semanasDesdeDescarga();
  if(sd>=6)av.push({t:'aviso',m:null,txt:`Llevas ${sd} semanas sin descarga. A partir de la sexta semana de acumulación conviene bajar el volumen a la mitad durante 5-7 días.`});
  // 6. adherencia
  const prev=S.plan.dias.length;
  const hechos=sem.length;
  if(S.logs.length>3&&hechos<prev-1)av.push({t:'aviso',m:null,txt:`Has completado ${hechos} de ${prev} sesiones previstas esta semana. Si te falta tiempo, reduce a ${Math.max(3,hechos+1)} días bien ejecutados en lugar de acortar sesiones.`});
  return{av,vol:base,usaPlan,freq,sem,mes};
}
function semanasDesdeDescarga(){
  const ref=S.deloads.length?S.deloads[S.deloads.length-1]:(S.logs[0]?S.logs[0].fecha:null);
  if(!ref)return 0;
  return Math.floor((new Date()-parseISO(ref))/(7*864e5));
}

const Timer={t:0,iv:null,
  start(seg){this.t=seg;$('#timerbar').classList.add('on');this.tick();clearInterval(this.iv);this.iv=setInterval(()=>{this.t--;this.tick();if(this.t<=0)this.fin();},1000);},
  add(s){this.t+=s;this.tick();},
  tick(){const m=Math.max(0,this.t);$('#timertxt').textContent=`Descanso ${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`;},
  fin(){clearInterval(this.iv);$('#timerbar').classList.remove('on');toast('Descanso terminado. Siguiente serie.');},
  stop(){clearInterval(this.iv);$('#timerbar').classList.remove('on');}

function lineChart(pts){
  if(!pts||pts.length<2)return'<div class="note">Necesitas al menos dos sesiones para ver la curva de progresión.</div>';
  const W=600,H=150,P=26;
  const ys=pts.map(p=>p.y),mn=Math.min(...ys)*0.97,mx=Math.max(...ys)*1.03;
  const x=i=>P+i*(W-P*2)/(pts.length-1),y=v=>H-P-(v-mn)/(mx-mn||1)*(H-P*2);
  const dpath=pts.map((p,i)=>`${i?'L':'M'}${round(x(i),1)} ${round(y(p.y),1)}`).join(' ');
  const area=dpath+` L${x(pts.length-1)} ${H-P} L${x(0)} ${H-P} Z`;
  return`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;margin:10px 0">
    <defs><linearGradient id="g1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4C6FFF" stop-opacity=".35"/><stop offset="1" stop-color="#4C6FFF" stop-opacity="0"/></linearGradient></defs>
    <line x1="${P}" y1="${H-P}" x2="${W-P}" y2="${H-P}" stroke="#26313F"/>
    <path d="${area}" fill="url(#g1)"/><path d="${dpath}" fill="none" stroke="#4C6FFF" stroke-width="2.5" stroke-linejoin="round"/>
    ${pts.map((p,i)=>`<circle cx="${round(x(i),1)}" cy="${round(y(p.y),1)}" r="3.2" fill="#0B0E13" stroke="#4C6FFF" stroke-width="2"/>`).join('')}
    <text x="${P}" y="14" fill="#8A99AC" font-size="11" font-family="monospace">${round(mx,1)} kg</text>
    <text x="${P}" y="${H-8}" fill="#8A99AC" font-size="11" font-family="monospace">${fecha(pts[0].x)}</text>
    <text x="${W-P}" y="${H-8}" fill="#8A99AC" font-size="11" font-family="monospace" text-anchor="end">${fecha(pts[pts.length-1].x)}</text>
  </svg>`;
}
function barsSemanas(n=8){
  const hoy=new Date(),sem=[];
  for(let i=n-1;i>=0;i--){
    const d0=new Date(hoy);d0.setDate(hoy.getDate()-i*7);
    const k=semanaDe(dISO(d0));
    const logs=S.logs.filter(l=>semanaDe(l.fecha)===k);
    sem.push({k,ton:logs.reduce((a,l)=>a+tonelaje(l),0),ser:logs.reduce((a,l)=>a+seriesTotales(l),0),n:logs.length});
  }
  const mx=Math.max(1,...sem.map(s=>s.ton));
  return`<div class="row" style="align-items:flex-end;gap:6px;height:140px;margin-top:10px">
    ${sem.map(s=>`<div style="flex:1;text-align:center">

      <div class="exmeta" style="font-size:9.5px;margin-top:5px">${parseISO(s.k).getDate()}/${parseISO(s.k).getMonth()+1}</div>

    <div class="exmeta" style="text-align:center;margin-top:6px">Tonelaje por semana · el número es el total de series</div>`;

function barsMusculo(vol){
  const ks=Object.keys(MUSC).filter(m=>m!=='pes'&&m!=='pei').filter(m=>agr(vol,m)>0||['glut','cuad','isq','dor','pec','dla'].includes(m));
  return ks.map(m=>{
    const L=MUSC[m],v=Math.round(agr(vol,m)),t=Math.min(1,v/L.mrv);
    const col=v===0?'#26313F':v<L.mev?'var(--amber)':v>L.mrv?'var(--rose)':v>L.mav?'var(--violet)':'var(--mint)';
    const est=v===0?'sin trabajo':v<L.mev?'por debajo del mínimo':v>L.mrv?'por encima del máximo':v>L.mav?'volumen alto':'rango óptimo';
    return`<div style="margin-bottom:11px">
      <div class="between" style="margin-bottom:4px"><span style="font-size:13px">${L.n}</span>
      <span class="exmeta">${v} series · ${est}</span></div>
      <div class="bar"><i style="width:${Math.max(2,t*100)}%;background:${col}"></i>
        <span style="position:absolute;left:${L.mev/L.mrv*100}%;top:0;bottom:0;width:1px;background:#8A99AC66"></span>
        <span style="position:absolute;left:${L.mav/L.mrv*100}%;top:0;bottom:0;width:1px;background:#8A99AC66"></span>
      </div></div>`;}).join('');
}

function vCalendario(){
  const ref=SUB.mes?parseISO(SUB.mes):new Date();
  const y=ref.getFullYear(),m=ref.getMonth();
  const prim=new Date(y,m,1),ult=new Date(y,m+1,0);
  const off=(prim.getDay()+6)%7;
  const celdas=[];
  for(let i=0;i<off;i++)celdas.push('<div></div>');
  for(let dnum=1;dnum<=ult.getDate();dnum++){
    const iso=dISO(new Date(y,m,dnum));
    const logs=S.logs.filter(l=>l.fecha===iso);
    const dow=new Date(y,m,dnum).getDay();
    const plan=planSemana(iso).dias.find(x=>x.dow===dow);
    const pr=logs.some(l=>(l.prs||[]).length);
    const deload=S.deloads.some(d=>semanaDe(d)===semanaDe(iso));
    const cls=['day',logs.length?'done':'',plan&&!logs.length?'plan':'',iso===hoyISO()?'today':''].join(' ');
    celdas.push(`<button class="${cls}" onclick="diaCal('${iso}')" title="${plan?esc(plan.nombre):'Descanso'}">
      ${dnum}${pr?'<span class="pr">★</span>':''}
      ${deload?'<span class="dot" style="background:var(--amber)"></span>':logs.length?'<span class="dot" style="background:var(--cobalt)"></span>':''}</button>`);
  }
  const mesLogs=S.logs.filter(l=>l.fecha.startsWith(`${y}-${String(m+1).padStart(2,'0')}`));
  return head(MES[m][0].toUpperCase()+MES[m].slice(1)+' '+y,'Calendario de entrenamiento',
   `<div class="row"><button class="icobtn" onclick="mesRel(-1)">‹</button><button class="icobtn" onclick="mesRel(1)">›</button></div>`)+
  resumenSemana()+
  `<div class="card">
    <div class="cal" style="margin-bottom:6px">${['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'].map(d=>`<div class="dow">${d}</div>`).join('')}</div>
    <div class="cal">${celdas.join('')}</div>
    <div class="divider"></div>
    <div class="row wrap" style="gap:14px">
      <span class="exmeta"><span style="display:inline-block;width:10px;height:10px;border-radius:3px;background:#152B3F;border:1px solid var(--cobalt)"></span> entrenado</span>
      <span class="exmeta"><span style="display:inline-block;width:10px;height:10px;border-radius:3px;border:1px dashed #3A4A5E"></span> previsto</span>
      <span class="exmeta"><span style="color:var(--amber)">★</span> récord</span>
      <span class="exmeta"><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--amber)"></span> descarga</span>
    </div>
  </div>
  <div class="card"><div class="between"><h3>Resumen del mes</h3><span class="tag">${mesLogs.length} sesiones</span></div>
    <div class="grid g3" style="margin-top:12px">
      <div class="stat"><div class="v">${mesLogs.reduce((a,l)=>a+seriesTotales(l),0)}</div><div class="l">Series</div></div>
      <div class="stat"><div class="v">${Math.round(mesLogs.reduce((a,l)=>a+tonelaje(l),0)).toLocaleString('es')}</div><div class="l">Kg movidos</div></div>
      <div class="stat"><div class="v">${mesLogs.reduce((a,l)=>a+(l.prs||[]).length,0)}</div><div class="l">Récords</div></div>
    </div>
    <div class="sp16"></div>
    ${mesLogs.slice().reverse().map(l=>`<div class="exrow" style="cursor:pointer" onclick="verSesion('${l.id}')">
      <div class="idx">${parseISO(l.fecha).getDate()}</div>
      <div style="flex:1"><div class="exname">${esc(l.diaNombre)}</div><div class="exmeta">${seriesTotales(l)} series · ${Math.round(tonelaje(l))} kg</div></div>
      ${(l.prs||[]).length?'<span class="tag acc">PR</span>':''}</div>`).join('')||'<div class="empty">Sin sesiones este mes</div>'}
  </div>
  ${semanasDelMes(y,m)}

function mesRel(n){const ref=SUB.mes?parseISO(SUB.mes):new Date();ref.setMonth(ref.getMonth()+n);SUB.mes=dISO(new Date(ref.getFullYear(),ref.getMonth(),1));render();}
function diaCal(iso){
  const logs=S.logs.filter(l=>l.fecha===iso);
  if(logs.length===1)return verSesion(logs[0].id);
  const dow=parseISO(iso).getDay();
  const plan=planSemana(iso).dias.find(x=>x.dow===dow);
  abrirSheet(`<div class="eyebrow">${parseISO(iso).toLocaleDateString('es',{weekday:'long',day:'numeric',month:'long'})}</div>

}

function importar(){
  const i=document.createElement('input');i.type='file';i.accept='.json';
  i.onchange=()=>{const f=i.files[0];if(!f)return;const r=new FileReader();
    r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.plan||!d.logs)throw 0;S=d;guardar();render();toast('Datos importados');}catch(e){toast('El archivo no tiene el formato esperado');}};
    r.readAsText(f);};
  i.click();
}

/* ===================== BIBLIOTECA DE RUTINAS Y PLANTILLAS =====================
   Separa PLANIFICACIÓN (plantillas guardadas, versionadas, intactas)
   de REGISTRO (sesiones con pesos, reps, RIR y sensaciones).           */

const OBJETIVOS=['Hipertrofia','Fuerza','Powerbuilding','Recomposición','Definición','Salud y movilidad'];
const CATEGORIAS=['Mesociclo','Acumulación','Intensificación','Descarga','Mantenimiento','Casa / viaje','Prueba'];

function migrarBib(){
  if(!S.bib||!S.bib.rutinas)S.bib={rutinas:[],dias:[]};
  if(!S.bib.dias)S.bib.dias=[];
  if(!S.asignaciones)S.asignaciones={};
  Object.entries(PLANTILLAS).forEach(([k,t])=>{
    if(S.bib.rutinas.some(r=>r.sys===k))return;
    const id=uid();
    const misma=S.plan&&S.plan.clave===k&&!S.plan.origen;
    S.bib.rutinas.push({id,raiz:id,version:1,sys:k,nombre:t.nombre,obj:t.obj,nivel:t.nivel,
      cat:k==='casa4'?'Casa / viaje':'Mesociclo',semanas:6,notas:t.desc,fav:false,arch:false,
      creada:hoyISO(),modif:hoyISO(),
      dias:misma?clonDias(S.plan.dias,false)
        :t.dias.map(x=>({id:uid(),nombre:x.nombre,foco:x.foco,dow:x.dow,ejercicios:x.ejercicios.map(e=>({...e,uid:uid()}))}))});
    if(misma)S.plan.origen={rutinaId:id,raiz:id,version:1};
  });
  if(!S.plan.origen){
    const base=S.bib.rutinas.find(r=>r.sys===S.plan.clave);
    if(base)S.plan.origen={rutinaId:base.id,raiz:base.raiz,version:base.version};
  }
}
const rutina=id=>S.bib.rutinas.find(r=>r.id===id);
const versiones=raiz=>S.bib.rutinas.filter(r=>r.raiz===raiz).sort((a,b)=>a.version-b.version);
const ultimaVersion=raiz=>versiones(raiz).slice(-1)[0];
const rutinaActiva=()=>S.plan.origen?rutina(S.plan.origen.rutinaId):null;
function clonDias(dias,nuevos){
  return (dias||[]).map(x=>({id:nuevos?uid():x.id,nombre:x.nombre,foco:x.foco,dow:x.dow,
    ejercicios:(x.ejercicios||[]).map(e=>({...e,uid:uid()}))}));
}
function diaEn(r,dia){
  if(!r||!dia)return null;
  return r.dias.find(x=>x.id===dia.id)||r.dias.find(x=>x.nombre===dia.nombre)||null;
}
function buscarDia(id){
  let d=(S.plan.dias||[]).find(x=>x.id===id);if(d)return d;
  for(const r of S.bib.rutinas){const y=r.dias.find(x=>x.id===id);if(y)return y;}
  return null;
}
function volumenDias(dias){const v={};(dias||[]).forEach(dd=>dd.ejercicios.forEach(it=>{const e=EXI[it.ex];if(e)repartir(v,e,it.series);}));return v;}
function topMusculos(dias,n){return Object.entries(volumenDias(dias)).sort((a,b)=>b[1]-a[1]).slice(0,n||3).map(t=>MUSC[t[0]].n+' '+round(t[1],0));}
function seriesDe(r){return r.dias.reduce((a,d)=>a+d.ejercicios.reduce((x,i)=>x+i.series,0),0);}
function nomEx(id){return EXI[id]?EXI[id].n:id;}

/* ---------- planificación por semanas del calendario ---------- */
function planSemana(iso){
  const a=S.asignaciones[semanaDe(iso||hoyISO())];
  const r=a?rutina(a):null;
  return r||S.plan;
}
function diaDeHoy(){
  const dow=new Date().getDay();
  return planSemana(hoyISO()).dias.find(x=>x.dow===dow)||null;
}
function bannerSemana(){
  const a=S.asignaciones[semanaDe(hoyISO())];const r=a?rutina(a):null;
  if(!r)return'';
  return`<div class="card" style="border-color:#2A3A6B;margin-bottom:12px"><div class="between">
   <div><span class="eyebrow" style="color:var(--cobalt)">Semana planificada</span>
   <div class="exname" style="margin-top:3px">${esc(r.nombre)}${r.version>1?` · v${r.version}`:''}</div></div>
   <button class="btn sm" onclick="ir('plan')">Ver</button></div></div>`;
}
function asignarSheet(iso){
  const k=semanaDe(iso||hoyISO());
  const act=S.asignaciones[k];
  const lista=S.bib.rutinas.filter(r=>!r.arch).sort((a,b)=>(b.fav-a.fav)||(b.modif<a.modif?-1:1));
  abrirSheet(`<div class="sheethead between"><h3>Planificar la semana</h3><button class="icobtn" onclick="cerrarSheet()">✕</button></div>
   <p class="muted" style="margin:0 0 12px;font-size:13.5px">Semana del ${fecha(k)}. La rutina elegida marca los días previstos en el calendario y en la pantalla de Hoy, sin tocar tu rutina activa ni el historial.</p>
   ${act?`<div class="note" style="margin-bottom:12px">Asignada ahora: <b>${esc((rutina(act)||{}).nombre||'—')}</b>
     <button class="btn sm" style="margin-left:8px" onclick="quitarSemana('${k}')">Quitar</button></div>`:''}
   ${lista.map(r=>`<div class="exrow"><div style="flex:1;min-width:0">
     <div class="exname">${esc(r.nombre)}${r.version>1?` <span class="tag">v${r.version}</span>`:''}</div>
     <div class="exmeta">${r.obj} · ${r.dias.length} días · ${seriesDe(r)} series</div></div>
     <button class="btn sm ${act===r.id?'':'pri'}" onclick="asignarSemana('${k}','${r.id}')">${act===r.id?'Activa':'Asignar'}</button></div>`).join('')
   ||'<div class="empty">Aún no tienes rutinas guardadas</div>'}`);
}
function asignarSemana(k,id){S.asignaciones[k]=id;guardar();cerrarSheet();render();toast('Semana planificada con '+rutina(id).nombre);}
function quitarSemana(k){delete S.asignaciones[k];guardar();cerrarSheet();render();toast('Asignación retirada');}

/* ---------- guardar / versionar / duplicar ---------- */
function guardarPlanSheet(){
  const o=rutinaActiva();
  abrirSheet(`<div class="sheethead between"><h3>Guardar rutina como plantilla</h3><button class="icobtn" onclick="cerrarSheet()">✕</button></div>
   <div class="field"><label class="f">Nombre</label><input id="rn" value="${esc(S.plan.nombre)}" placeholder="Glúteos · Mesociclo 1"></div>
   <div class="grid g2">
     <div class="field"><label class="f">Objetivo</label><select id="ro">${OBJETIVOS.map(x=>`<option ${x===S.plan.obj?'selected':''}>${x}</option>`).join('')}</select></div>
     <div class="field"><label class="f">Nivel</label><select id="rl">${[1,2,3].map(n=>`<option value="${n}" ${n===2?'selected':''}>${NIVEL[n]}</option>`).join('')}</select></div>
     <div class="field"><label class="f">Categoría</label><select id="rc">${CATEGORIAS.map(x=>`<option>${x}</option>`).join('')}</select></div>
     <div class="field"><label class="f">Duración (semanas)</label><input id="rw" type="number" min="1" max="16" value="6"></div>
   </div>
   <div class="field"><label class="f">Notas de planificación</label><textarea id="rd" rows="2" placeholder="Intención del bloque, progresión prevista, cuándo descargar…"></textarea></div>
   <button class="btn pri blk" onclick="guardarPlanConfirmar(false)">Guardar como plantilla nueva</button>
   ${o?`<div class="sp8"></div><button class="btn blk" onclick="guardarPlanConfirmar(true)">Guardar como versión v${ultimaVersion(o.raiz).version+1} de «${esc(o.nombre)}»</button>
   <p class="exmeta" style="margin:8px 0 0">La versión anterior se conserva intacta para poder compararlas.</p>`:''}`);
}
function guardarPlanConfirmar(comoVersion){
  const nombre=($('#rn').value||'').trim()||'Rutina sin nombre';
  const o=rutinaActiva();
  const base={nombre,obj:$('#ro').value,nivel:num($('#rl').value)||2,cat:$('#rc').value,
    semanas:num($('#rw').value)||6,notas:$('#rd').value,fav:false,arch:false,sys:null,
    creada:hoyISO(),modif:hoyISO(),dias:clonDias(S.plan.dias,false)};
  let r;
  if(comoVersion&&o){r={...base,id:uid(),raiz:o.raiz,version:ultimaVersion(o.raiz).version+1};}
  else{const id=uid();r={...base,id,raiz:id,version:1,dias:clonDias(S.plan.dias,true)};}
  S.bib.rutinas.push(r);
  S.plan.nombre=nombre;S.plan.obj=r.obj;
  S.plan.origen={rutinaId:r.id,raiz:r.raiz,version:r.version};
  S.plan.dias=clonDias(r.dias,false);
  guardar();cerrarSheet();SUB={tab:'bib'};render();
  toast(comoVersion?`Guardada como v${r.version}`:'Plantilla guardada en la biblioteca');
}
function nuevaVersion(id){
  const r=rutina(id);if(!r)return null;
  const n={...r,id:uid(),version:ultimaVersion(r.raiz).version+1,sys:null,
    dias:clonDias(r.dias,false),creada:hoyISO(),modif:hoyISO(),fav:false,arch:false};
  S.bib.rutinas.push(n);return n;
}
function crearVersion(id){
  const n=nuevaVersion(id);if(!n)return;
  guardar();cerrarSheet();render();toast(`Versión v${n.version} creada`);abrirRutina(n.id);
}
function duplicarRutina(id){
  const r=rutina(id);if(!r)return;
  const nid=uid();
  S.bib.rutinas.push({...r,id:nid,raiz:nid,version:1,sys:null,nombre:r.nombre+' (copia)',
    dias:clonDias(r.dias,true),creada:hoyISO(),modif:hoyISO(),fav:false,arch:false});
  guardar();cerrarSheet();render();toast('Rutina duplicada');
}
function usarRutina(id){
  const r=rutina(id);if(!r)return;
  S.plan={clave:r.sys||null,nombre:r.nombre,obj:r.obj,creada:hoyISO(),
    origen:{rutinaId:r.id,raiz:r.raiz,version:r.version},dias:clonDias(r.dias,false)};
  guardar();cerrarSheet();SUB={tab:'activa'};render();
  toast('Rutina activa: '+r.nombre+'. Tu historial se mantiene.');
}
function editarCopia(id){
  const r=rutina(id);if(!r)return;
  const n=nuevaVersion(id);
  guardar();usarRutina(n.id);
  toast(`Editas la versión v${n.version}. La v${r.version} queda intacta.`);
}
function favRutina(id){const r=rutina(id);r.fav=!r.fav;guardar();render();if($('#sheet').classList.contains('on'))abrirRutina(id);}
function archivarRutina(id){const r=rutina(id);r.arch=!r.arch;r.modif=hoyISO();guardar();cerrarSheet();render();toast(r.arch?'Rutina archivada':'Rutina recuperada');}
function borrarRutina(id){
  const r=rutina(id);if(!r)return;
  abrirSheet(`<h3>Eliminar «${esc(r.nombre)}»</h3>
   <p class="muted">Se borra solo la planificación. Las sesiones que ya entrenaste con ella siguen en tu historial.</p>
   <div class="row"><button class="btn blk" onclick="abrirRutina('${id}')">Cancelar</button>
   <button class="btn dg blk" onclick="borrarRutinaOk('${id}')">Eliminar</button></div>`);
}
function borrarRutinaOk(id){
  S.bib.rutinas=S.bib.rutinas.filter(r=>r.id!==id);
  Object.keys(S.asignaciones).forEach(k=>{if(S.asignaciones[k]===id)delete S.asignaciones[k];});
  guardar();cerrarSheet();render();toast('Rutina eliminada');
}

/* ---------- días guardados ---------- */

  const dd=buscarDia(diaId);if(!dd)return;
  abrirSheet(`<div class="sheethead between"><h3>Guardar día como plantilla</h3><button class="icobtn" onclick="cerrarSheet()">✕</button></div>
   <div class="field"><label class="f">Nombre</label><input id="dnn" value="${esc(dd.nombre)}" placeholder="Piernas A"></div>
   <p class="exmeta">${dd.ejercicios.length} ejercicios · ${dd.ejercicios.reduce((a,x)=>a+x.series,0)} series · ${topMusculos([dd],3).join(' · ')}</p>
   <div class="sp16"></div><button class="btn pri blk" onclick="guardarDiaOk('${diaId}')">Guardar en la biblioteca</button>`);
}
function guardarDiaOk(diaId){

  guardar();cerrarSheet();render();toast('Día guardado. Reutilízalo en cualquier rutina.');
}
function insertarDiaSheet(){
  const lista=S.bib.dias.filter(d=>!d.arch);
  abrirSheet(`<div class="sheethead between"><h3>Añadir día desde la biblioteca</h3><button class="icobtn" onclick="cerrarSheet()">✕</button></div>
   ${lista.map(d=>`<div class="exrow"><div style="flex:1;min-width:0">
     <div class="exname">${esc(d.nombre)}${d.fav?' ★':''}</div>

   ||'<div class="empty">Todavía no has guardado ningún día. Puedes hacerlo desde cualquier día de tu rutina.</div>'}`);
}
function insertarDia(bid){
  const d=S.bib.dias.find(x=>x.id===bid);if(!d)return;
  S.plan.dias.push({id:uid(),nombre:d.nombre,foco:d.foco,dow:7,ejercicios:d.ejercicios.map(e=>({...e,uid:uid()}))});
  guardar();cerrarSheet();SUB={tab:'activa'};render();toast('Día añadido a la rutina activa. Asígnale un día de la semana.');
}
function duplicarDiaPlan(diaId){
  const dd=S.plan.dias.find(x=>x.id===diaId);if(!dd)return;
  const ix=S.plan.dias.indexOf(dd);
  S.plan.dias.splice(ix+1,0,{id:uid(),nombre:dd.nombre+' (copia)',foco:dd.foco,dow:7,
    ejercicios:dd.ejercicios.map(e=>({...e,uid:uid()}))});
  guardar();cerrarSheet();render();toast('Día duplicado');
}
function favDia(id){const d=S.bib.dias.find(x=>x.id===id);d.fav=!d.fav;guardar();render();}
function archivarDia(id){const d=S.bib.dias.find(x=>x.id===id);d.arch=!d.arch;guardar();render();toast(d.arch?'Día archivado':'Día recuperado');}
function borrarDiaBib(id){S.bib.dias=S.bib.dias.filter(x=>x.id!==id);guardar();render();toast('Día eliminado de la biblioteca');}

/* ---------- exportar / importar plantillas ---------- */
function bajarJSON(obj,nombre){
  const blob=new Blob([JSON.stringify(obj,null,1)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download=nombre.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')+'.json';a.click();
}
function exportarRutina(id){const r=rutina(id);bajarJSON({forja:'rutina',v:1,rutina:r},'forja-'+r.nombre);toast('Rutina exportada');}
function exportarDiaBib(id){const d=S.bib.dias.find(x=>x.id===id);bajarJSON({forja:'dia',v:1,dia:d},'forja-dia-'+d.nombre);toast('Día exportado');}
function exportarBib(){bajarJSON({forja:'biblioteca',v:1,bib:S.bib},'forja-biblioteca-'+hoyISO());toast('Biblioteca exportada');}
function importarPlantilla(){
  const i=document.createElement('input');i.type='file';i.accept='.json';
  i.onchange=()=>{const f=i.files[0];if(!f)return;const r=new FileReader();
    r.onload=()=>{try{
      const d=JSON.parse(r.result);let n=0;
      const meterR=x=>{const nid=uid();S.bib.rutinas.push({...x,id:nid,raiz:nid,version:1,sys:null,
        nombre:x.nombre+' (importada)',dias:clonDias(x.dias,true),creada:hoyISO(),modif:hoyISO(),fav:false,arch:false});n++;};
      const meterD=x=>{S.bib.dias.push({...x,id:uid(),creada:hoyISO(),modif:hoyISO(),fav:false,arch:false,
        ejercicios:(x.ejercicios||[]).map(e=>({...e,uid:uid()}))});n++;};
      if(d.forja==='rutina'&&d.rutina)meterR(d.rutina);
      else if(d.forja==='dia'&&d.dia)meterD(d.dia);
      else if(d.forja==='biblioteca'&&d.bib){(d.bib.rutinas||[]).forEach(meterR);(d.bib.dias||[]).forEach(meterD);}
      else throw 0;
      guardar();render();toast(n+(n===1?' plantilla importada':' plantillas importadas'));
    }catch(e){toast('El archivo no es una plantilla de FORJA');}};
    r.readAsText(f);};
  i.click();
}

/* ---------- versiones y comparación ---------- */
function versionesSheet(raiz){
  const vs=versiones(raiz).slice().reverse();
  abrirSheet(`<div class="sheethead between"><h3>Historial de versiones</h3><button class="icobtn" onclick="cerrarSheet()">✕</button></div>
   ${vs.map((r,i)=>`<div class="card" style="padding:12px;margin-bottom:10px">
     <div class="between"><div><span class="eyebrow">v${r.version} · creada ${fecha(r.creada)}</span>
       <div class="exname" style="margin-top:3px">${esc(r.nombre)}</div>
       <div class="exmeta">${r.dias.length} días · ${seriesDe(r)} series · última edición ${fecha(r.modif)}</div></div>
       ${S.plan.origen&&S.plan.origen.rutinaId===r.id?'<span class="tag" style="color:var(--mint)">Activa</span>':''}</div>
     <div class="row" style="margin-top:10px">
       <button class="btn sm pri" onclick="usarRutina('${r.id}')">Usar</button>
       <button class="btn sm" onclick="abrirRutina('${r.id}')">Ver</button>
       ${vs[i+1]?`<button class="btn sm" onclick="compararSheet('${vs[i+1].id}','${r.id}')">Comparar con v${vs[i+1].version}</button>`:''}</div>
   </div>`).join('')}`);
}
function diffDias(a,b){
  const out=[];
  const ea=a?a.ejercicios:[],eb=b?b.ejercicios:[];
  ea.forEach(x=>{if(!eb.some(y=>y.ex===x.ex))out.push(['−',nomEx(x.ex)+' ('+x.series+' series)']);});
  eb.forEach(x=>{if(!ea.some(y=>y.ex===x.ex))out.push(['+',nomEx(x.ex)+' ('+x.series+' series)']);});
  eb.forEach(x=>{const y=ea.find(z=>z.ex===x.ex);if(!y)return;
    if(y.series!==x.series||y.repMin!==x.repMin||y.repMax!==x.repMax||y.desc!==x.desc)
      out.push(['~',nomEx(x.ex)+': '+y.series+'×'+y.repMin+'-'+y.repMax+' / '+y.desc+'s → '+x.series+'×'+x.repMin+'-'+x.repMax+' / '+x.desc+'s']);});
  return out;
}
function compararSheet(aId,bId){
  const A=rutina(aId),B=rutina(bId);if(!A||!B)return;
  const nombres=[...new Set([...A.dias.map(d=>d.nombre),...B.dias.map(d=>d.nombre)])];
  const vA=volumenDias(A.dias),vB=volumenDias(B.dias);
  const musc=[...new Set([...Object.keys(vA),...Object.keys(vB)])]
    .map(m=>[m,round(vA[m]||0,0),round(vB[m]||0,0)])
    .filter(x=>x[1]!==x[2]).sort((a,b)=>Math.abs(b[2]-b[1])-Math.abs(a[2]-a[1])).slice(0,8);
  const col=t=>t==='+'?'var(--mint)':t==='−'?'var(--rose)':'var(--amber)';
  abrirSheet(`<div class="sheethead between"><h3>v${A.version} → v${B.version}</h3><button class="icobtn" onclick="versionesSheet('${A.raiz}')">✕</button></div>
   <p class="exmeta" style="margin:0 0 12px">${seriesDe(A)} series semanales → ${seriesDe(B)} · ${A.dias.length} días → ${B.dias.length}</p>
   ${nombres.map(n=>{const d=diffDias(A.dias.find(x=>x.nombre===n),B.dias.find(x=>x.nombre===n));
     if(!d.length)return'';
     return`<div class="card" style="padding:12px;margin-bottom:10px"><div class="exname">${esc(n)}</div>
      ${d.map(([t,txt])=>`<div class="exmeta" style="margin-top:6px"><span style="color:${col(t)};font-family:var(--mono)">${t}</span> ${esc(txt)}</div>`).join('')}</div>`;}).join('')
   ||'<div class="empty">Las dos versiones tienen los mismos ejercicios</div>'}
   ${musc.length?`<div class="card" style="padding:12px"><div class="eyebrow">Cambio de volumen semanal</div>
     ${musc.map(([m,a,b])=>`<div class="between" style="margin-top:8px"><span class="exmeta">${MUSC[m].n}</span>
       <span class="exmeta" style="font-family:var(--mono);color:${b>a?'var(--mint)':'var(--rose)'}">${a} → ${b} series</span></div>`).join('')}</div>`:''}`);
}

/* ---------- ficha de rutina guardada ---------- */
function abrirRutina(id){
  const r=rutina(id);if(!r)return;
  const vs=versiones(r.raiz);
  const act=S.plan.origen&&S.plan.origen.rutinaId===r.id;
  abrirSheet(`<div class="sheethead"><div class="between"><h3 style="min-width:0">${esc(r.nombre)}</h3>
     <button class="icobtn" onclick="cerrarSheet()">✕</button></div>
   <div class="chiprow" style="margin-top:6px"><span class="tag">${r.obj}</span><span class="tag">${NIVEL[r.nivel]}</span>
     <span class="tag">${r.dias.length} días</span><span class="tag">${r.cat}</span>
     <span class="tag">${r.semanas} semanas</span>${r.version>1?`<span class="tag acc">v${r.version}</span>`:''}
     ${act?'<span class="tag" style="color:var(--mint)">Activa</span>':''}${r.arch?'<span class="tag">Archivada</span>':''}</div></div>
   ${r.notas?`<p class="muted" style="font-size:13.5px;margin:0 0 12px">${esc(r.notas)}</p>`:''}
   <div class="exmeta" style="margin-bottom:12px">Creada ${fecha(r.creada)} · última modificación ${fecha(r.modif)} · ${seriesDe(r)} series semanales · ${topMusculos(r.dias,3).join(' · ')}</div>
   ${r.dias.map(d=>`<div class="card" style="padding:12px;margin-bottom:8px">
     <div class="between"><div style="min-width:0"><span class="eyebrow">${d.dow<7?DOW[d.dow]:'Sin asignar'}</span>

function bf(){if(!SUB.bf)SUB.bf={q:'',obj:'',freq:'',cat:'',fav:false,arch:false};return SUB.bf;}
function setBf(k,v){const f=bf();f[k]=(k==='fav'||k==='arch')?!f[k]:v;render();}
function vBiblioteca(){
  const f=bf();
  let lista=S.bib.rutinas.filter(r=>{
    const vs=versiones(r.raiz);
    if(vs.length>1&&!f.todas&&r.id!==ultimaVersion(r.raiz).id&&!(S.plan.origen&&S.plan.origen.rutinaId===r.id))return false;
    if(!!r.arch!==!!f.arch)return false;
    if(f.fav&&!r.fav)return false;
    if(f.obj&&r.obj!==f.obj)return false;
    if(f.cat&&r.cat!==f.cat)return false;
    if(f.freq&&r.dias.length!==+f.freq)return false;
    if(f.q&&!(r.nombre.toLowerCase().includes(f.q)||(r.notas||'').toLowerCase().includes(f.q)))return false;
    return true;});
  lista=lista.sort((a,b)=>(b.fav-a.fav)||(a.modif<b.modif?1:-1));
  const filtros=`<div class="card" style="margin-bottom:12px">
    <input placeholder="Buscar rutina por nombre o notas" value="${esc(f.q)}" oninput="setBf('q',this.value.toLowerCase())">
    <div class="sp8"></div>
    <div class="grid g2">
      <select onchange="setBf('obj',this.value)"><option value="">Cualquier objetivo</option>${OBJETIVOS.map(o=>`<option ${f.obj===o?'selected':''}>${o}</option>`).join('')}</select>
      <select onchange="setBf('cat',this.value)"><option value="">Cualquier categoría</option>${CATEGORIAS.map(o=>`<option ${f.cat===o?'selected':''}>${o}</option>`).join('')}</select>

    <div class="chiprow"><button class="chip ${!f.freq?'on':''}" onclick="setBf('freq','')">Días</button>
      ${[3,4,5,6].map(n=>`<button class="chip ${f.freq==n?'on':''}" onclick="setBf('freq','${n}')">${n}</button>`).join('')}
      <button class="chip ${f.fav?'on':''}" onclick="setBf('fav')">★ Favoritas</button>
      <button class="chip ${f.arch?'on':''}" onclick="setBf('arch')">Archivadas</button></div>
  </div>`;
  const cards=lista.map(r=>{
    const vs=versiones(r.raiz);

    return`<div class="card">
      <div class="between"><div style="min-width:0">
        <span class="eyebrow">${r.cat} · ${NIVEL[r.nivel]} · ${r.dias.length} días/semana</span>
        <h3 style="margin:3px 0 6px">${r.fav?'<span style="color:var(--amber)">★</span> ':''}${esc(r.nombre)}</h3>
        <div class="exmeta">${seriesDe(r)} series semanales · ${topMusculos(r.dias,3).join(' · ')}</div>
        <div class="exmeta">Creada ${fecha(r.creada)} · modificada ${fecha(r.modif)}</div>
      </div><div class="row">${act?'<span class="tag" style="color:var(--mint)">Activa</span>':''}${vs.length>1?`<span class="tag acc">v${r.version}</span>`:''}</div></div>
      ${r.notas?`<p class="muted" style="margin:10px 0 0;font-size:13px">${esc(r.notas).slice(0,180)}</p>`:''}
      <div class="sp16"></div>
      <div class="row wrap"><button class="btn sm pri" onclick="usarRutina('${r.id}')">Usar</button>
        <button class="btn sm" onclick="abrirRutina('${r.id}')">Abrir</button>
        <button class="btn sm" onclick="duplicarRutina('${r.id}')">Duplicar</button>
        ${vs.length>1?`<button class="btn sm" onclick="versionesSheet('${r.raiz}')">${vs.length} versiones</button>`:''}
        <button class="btn sm" onclick="asignarSheet(hoyISO())">Planificar semana</button></div>
    </div>`;}).join('')||`<div class="empty">No hay rutinas con esos filtros.</div>`;
  return filtros+cards+`<div class="sp16"></div>
    <div class="row wrap"><button class="btn" onclick="guardarPlanSheet()">Guardar la rutina activa</button>

/* ---------- cambios durante la sesión: sesión / plantilla / versión ---------- */
let PEND=null;
function pedirDestino(desc,fn){
  PEND={desc,fn};
  const r=rutinaActiva();
  abrirSheet(`<div class="sheethead"><h3>¿Dónde guardo este cambio?</h3></div>
   <p class="muted" style="margin:0 0 14px;font-size:13.5px">${esc(desc)}</p>
   <div class="card" style="padding:12px;margin-bottom:8px">
     <button class="btn pri blk" onclick="aplicarDestino('sesion')">Solo en esta sesión</button>
     <p class="exmeta" style="margin:8px 0 0">Queda registrado en el historial de hoy. La plantilla no se toca.</p></div>
   <div class="card" style="padding:12px;margin-bottom:8px">
     <button class="btn blk" onclick="aplicarDestino('plantilla')">Actualizar la plantilla</button>
     <p class="exmeta" style="margin:8px 0 0">${r?`Se modifica «${esc(r.nombre)}»${r.version>1?` v${r.version}`:''} y se aplicará a los próximos entrenamientos.`:'Se modifica tu rutina activa para los próximos entrenamientos.'}</p></div>
   <div class="card" style="padding:12px">
     <button class="btn blk" onclick="aplicarDestino('version')">Crear una versión nueva</button>
     <p class="exmeta" style="margin:8px 0 0">${r?`Nace la v${ultimaVersion(r.raiz).version+1} con el cambio y la v${r.version} queda intacta para comparar.`:'Se guarda la rutina en la biblioteca como versión nueva.'}</p></div>`);
}
function aplicarDestino(op){
  const p=PEND;PEND=null;
  if(!p){cerrarSheet();return;}
  if(op==='sesion'){cerrarSheet();render();toast('Cambio aplicado solo a esta sesión');return;}
  let r=rutinaActiva();
  if(!r){
    const id=uid();
    r={id,raiz:id,version:1,sys:null,nombre:S.plan.nombre,obj:S.plan.obj,nivel:S.perfil.nivel||2,
      cat:'Mesociclo',semanas:6,notas:'Creada automáticamente al editar durante una sesión.',
      fav:false,arch:false,creada:hoyISO(),modif:hoyISO(),dias:clonDias(S.plan.dias,false)};
    S.bib.rutinas.push(r);
    S.plan.origen={rutinaId:r.id,raiz:r.raiz,version:1};
  }
  if(op==='version'){
    const n=nuevaVersion(r.id);r=n;
    S.plan.origen={rutinaId:n.id,raiz:n.raiz,version:n.version};
  }
  const dp=S.plan.dias.find(x=>x.id===S.activa.diaId);
  if(dp)p.fn(dp);
  const dr=diaEn(r,dp||{id:S.activa.diaId,nombre:S.activa.diaNombre});
  if(dr&&dr!==dp)p.fn(dr);
  r.modif=hoyISO();
  guardar();cerrarSheet();render();
  toast(op==='version'?`Guardado en la nueva versión v${r.version}`:'Plantilla actualizada');
}

function elegirEjSesion(modo,i,exId){
  if(modo==='sust'){
    const en=S.activa.ejercicios[i];const viejo=en.ex;
    if(viejo===exId){cerrarSheet();return;}
    en.ex=exId;en.orig=en.orig||viejo;
    if(en.orig===exId)en.orig=null;
    guardar();
    pedirDestino(`Sustituir ${nomEx(viejo)} por ${nomEx(exId)} en ${S.activa.diaNombre}.`,
      dia=>{const it=dia.ejercicios.find(x=>x.ex===viejo);if(it)it.ex=exId;});
  }else{
    const e=EXI[exId];
    const r=(e.r.match(/(\d+)-(\d+)/)||[0,8,12]),rs=(e.rs.match(/(\d+)/)||[0,90]);
    const plan={series:num((e.se.match(/(\d+)/)||[0,3])[1])||3,repMin:num(r[1]),repMax:num(r[2]),desc:num(rs[1]),rir:e.rir};
    S.activa.ejercicios.push({ex:exId,plan,sets:Array.from({length:plan.series},()=>({kg:'',reps:'',rir:'',done:false})),notas:''});
    guardar();
    pedirDestino(`Añadir ${e.n} a ${S.activa.diaNombre}.`,
      dia=>{if(!dia.ejercicios.some(x=>x.ex===exId))dia.ejercicios.push({uid:uid(),ex:exId,...plan});});
  }
}
function quitarEjSesion(i){
  const en=S.activa.ejercicios[i];const ex=en.ex;
  S.activa.ejercicios.splice(i,1);guardar();
  pedirDestino(`Quitar ${nomEx(ex)} de ${S.activa.diaNombre}.`,
    dia=>{const ix=dia.ejercicios.findIndex(x=>x.ex===ex);if(ix>=0)dia.ejercicios.splice(ix,1);});
}
function objetivoSesion(i){
  const en=S.activa.ejercicios[i];
  abrirSheet(`<div class="sheethead between"><h3>Objetivo de ${esc(nomEx(en.ex))}</h3><button class="icobtn" onclick="cerrarSheet()">✕</button></div>
   <div class="grid g4">

function objetivoSesionOk(i){

/* ---------- planificación por semanas dentro del calendario ---------- */
function semanasDelMes(y,m){
  const ult=new Date(y,m+1,0).getDate(),claves=[];
  for(let d=1;d<=ult;d++){const k=semanaDe(dISO(new Date(y,m,d)));if(!claves.includes(k))claves.push(k);}
  const hoyK=semanaDe(hoyISO());
  return`<div class="card"><div class="between"><h3>Planificación por semanas</h3><span class="tag">${claves.length} semanas</span></div>
   <p class="muted" style="margin:8px 0 12px;font-size:13.5px">Asigna una plantilla de la biblioteca a cualquier semana: sus días pasan a marcar los entrenamientos previstos, sin tocar tu rutina activa ni el historial ya registrado.</p>
   ${claves.map(k=>{
     const r=S.asignaciones[k]?rutina(S.asignaciones[k]):null;
     const fin=new Date(parseISO(k));fin.setDate(fin.getDate()+6);
     const dl=S.deloads.some(x=>semanaDe(x)===k);
     return`<div class="exrow" style="cursor:pointer" onclick="asignarSheet('${k}')">
       <div class="idx" style="${k===hoyK?'color:var(--cobalt);border-color:var(--cobalt)':''}">${parseISO(k).getDate()}</div>
       <div style="flex:1;min-width:0"><div class="exname">${fecha(k)} – ${fecha(dISO(fin))}${k===hoyK?' · esta semana':''}</div>
       <div class="exmeta">${r?esc(r.nombre)+(r.version>1?` · v${r.version}`:''):'Sigue la rutina activa'}${dl?' · descarga':''}</div></div>
       <span class="tag ${r?'acc':''}">${r?'Plantilla':'—'}</span></div>`;}).join('')}
   </div>`;
}

   En casa la sustitución ya no depende solo de la etiqueta del ejercicio,

const EQUIPO=[
  {k:'cuerpo', n:'Peso corporal', fijo:true, cls:['Peso corporal']},
  {k:'mochila',n:'Mochila cargada', cls:['Mochila']},
  {k:'silla',  n:'Silla, sofá o banco', cls:['Silla o banco']},
  {k:'banda',  n:'Bandas elásticas', cls:['Banda']},
  {k:'mancu',  n:'Mancuernas', cls:['Mancuernas']},
  {k:'barra',  n:'Barra y discos', cls:['Barra']},
  {k:'banco',  n:'Banco de gimnasio', cls:['Banco']},
  {k:'kb',     n:'Kettlebell', cls:['Kettlebell']},
  {k:'puerta', n:'Barra de dominadas', cls:['Barra de puerta']}
];
const CLS2EQ={};EQUIPO.forEach(q=>q.cls.forEach(c=>CLS2EQ[c]=q.k));

function equipoDefecto(){return{cuerpo:true,mochila:true,silla:true,banda:true,mancu:false,barra:false,banco:false,kb:false,puerta:false};}
function migrarEquipo(){
  if(!S.ajustes.equipo)S.ajustes.equipo=equipoDefecto();
  S.ajustes.equipo.cuerpo=true;
  if(S.ajustes.rpe===undefined)S.ajustes.rpe=false;
}
function tengo(k){return !!(S.ajustes.equipo&&S.ajustes.equipo[k]);}
function disponible(e){
  if(!e)return false;
  if(S.ajustes.modo!=='casa')return true;
  const k=CLS2EQ[e.eqc];
  return k?tengo(k):false;

/* ---------- sustitución consciente del material ---------- */
function sugerirPorMusculo(id){
  const e=EXI[id];if(!e)return[];
  const mismo=x=>x.i!==id&&x.p[0]===e.p[0];
  const cand=EX.filter(x=>mismo(x)&&disponible(x));
  const punt=x=>(x.t===e.t?0:x.t==='multi'||e.t==='multi'?2:1)*10+Math.abs(x.d-e.d)
    +(x.s.filter(m=>e.s.includes(m)).length?-1:0);
  return cand.sort((a,b)=>punt(a)-punt(b));
}
function alternativas(id){
  const e=EXI[id];if(!e)return[];
  const out=[],vistos=new Set([id]);
  cadenaCasa(id).forEach(h=>{const x=EXI[h];if(x&&disponible(x)&&!vistos.has(h)){vistos.add(h);out.push(x);}});
  sugerirPorMusculo(id).forEach(x=>{if(!vistos.has(x.i)){vistos.add(x.i);out.push(x);}});
  if(S.ajustes.modo!=='casa'){
    EX.forEach(x=>{if(!vistos.has(x.i)&&x.p.includes(e.p[0])&&x.t===e.t){vistos.add(x.i);out.push(x);}});
  }
  return out;
}
function equivalenteCasa(id){
  const e=EXI[id];if(!e)return id;
  if(disponible(e))return id;
  const alt=alternativas(id);
  if(alt.length)return alt[0].i;
  const sec=EX.filter(x=>disponible(x)&&(x.p.includes(e.p[0])||x.s.includes(e.p[0])))
    .sort((a,b)=>(a.p.includes(e.p[0])?0:1)-(b.p.includes(e.p[0])?0:1)||Math.abs(a.d-e.d)-Math.abs(b.d-e.d));
  if(sec.length)return sec[0].i;
  return id;
}

/* ===================== FICHA VISUAL DEL EJERCICIO ===================== */
function medioCuerpo(e){
  const vol={};e.p.forEach(m=>vol[m]=3);e.s.forEach(m=>{if(!vol[m])vol[m]=1;});
  const partes=bodySVG(vol,3,true).split('</svg>');
  const atras=e.p.filter(m=>MUSC[m].v==='b').length>=e.p.filter(m=>MUSC[m].v==='f').length;
  return (atras?partes[1]:partes[0])+'</svg>';
}
function chipsMusculo(e){
  return`<div class="mus">${e.p.map((m,i)=>`<span class="${i===0?'p1':''}">${MUSC[m].n}</span>`).join('')}
   ${e.s.slice(0,3).map(m=>`<span>${MUSC[m].n}</span>`).join('')}</div>`;
}
function pista(e){return (e.ti&&e.ti[0])||(e.x&&e.x[1])||'';}
function prescripcion(it){return`${it.series}×${it.repMin}-${it.repMax} · ${it.desc}s de descanso · RIR ${it.rir}`;}

/* ===================== HISTORIAL COMPARATIVO ===================== */
function marcas(exId){
  const h=historial(exId);
  const r=record(exId);
  const ult=h.slice(-3).reverse();
  return{h,r,ult};
}
function lineaMarcas(exId,actual){
  const {r,ult}=marcas(exId);
  if(!ult.length&&!actual)return`<div class="hist"><span>Primera vez con este ejercicio</span></div>`;
  const dif=(a,b)=>{const d=a-b;return d>0?` (+${round(d,1)})`:d<0?` (${round(d,1)})`:'';};
  return`<div class="hist">
    ${actual?`<span class="now">Hoy ${actual}</span>`:''}
    ${ult.map((s,i)=>`<span>${i===0?'Última':fecha(s.fecha)} ${s.top.kg} kg × ${s.top.reps}${i===0&&ult[1]?dif(s.top.kg,ult[1].top.kg):''}</span>`).join('')}
    ${r?`<span class="best">Mejor ${r.kg} kg × ${r.reps} · 1RM ${Math.round(r.e1rm)}</span>`:''}
  </div>`;
}

function tiraSemana(){
  const hoy=new Date(),lun=parseISO(semanaDe(hoyISO()));

  for(let i=0;i<7;i++){
    const d=new Date(lun);d.setDate(lun.getDate()+i);
    const iso=dISO(d),dow=d.getDay();
    const logs=S.logs.filter(l=>l.fecha===iso);
    const plan=planSemana(iso).dias.find(x=>x.dow===dow);
    const cls=['',logs.length?'done':'',plan&&!logs.length?'plan':'',iso===hoyISO()?'hoy':''].join(' ');
    out.push(`<button class="${cls}" onclick="diaCal('${iso}')" title="${plan?esc(plan.nombre):'Descanso'}">
      ${DOW[dow]}<b>${d.getDate()}</b></button>`);
  }
  return`<div class="wk">${out.join('')}</div>`;
}

        <input inputmode="numeric" value="${s.reps}" placeholder="${en.plan.repMin}-${en.plan.repMax}" oninput="setVal(${i},${j},'reps',this.value)" class="${s.done?'setdone':''}">
        <input inputmode="numeric" value="${s.rir}" placeholder="${(en.plan.rir||'').split('-')[0]}" oninput="setVal(${i},${j},'rir',this.value)" class="${s.done?'setdone':''}">
        ${rpe?`<input inputmode="decimal" value="${s.rpe||''}" placeholder="8" oninput="setVal(${i},${j},'rpe',this.value)" class="${s.done?'setdone':''}">`:''}
        <button class="icobtn" style="${s.done?'color:var(--mint);border-color:#1D473A':''}" onclick="marcar(${i},${j})">✓</button>
      </div>`).join('')}
      <div class="row wrap" style="margin-top:10px">
        <button class="btn sm" onclick="addSet(${i})">+ Serie</button>
        <button class="btn sm" onclick="Timer.start(${en.plan.desc})">Descanso ${en.plan.desc}s</button>
        <button class="btn sm" onclick="notaEjercicio(${i})">Nota${en.notas?' •':''}</button>
        <button class="btn sm" onclick="menuEjSesion(${i})">Cambiar</button>
        <button class="btn sm" onclick="completarEj(${i})">Hecho</button>
      </div>
      ${en.notas?`<div class="note" style="margin-top:10px">${esc(en.notas)}</div>`:''}
    </div>`;}).join('');

  const vw={ejercicios:A.ejercicios.map(en=>({ex:en.ex}))};
  return head(esc(A.diaNombre),`Sesión en curso`,`<button class="btn sm" onclick="cancelarSesion()">Descartar</button>`)+
    barra+cardCalentamiento(vw,!!SUB.warm)+cards+
    `<div class="sp16"></div><button class="btn blk" onclick="pickerSesion('add',0,'','')">+ Añadir ejercicio a la sesión</button>
     <div class="sp8"></div><button class="btn pri blk" onclick="terminarSesion()">Terminar y guardar sesión</button><div class="sp24"></div>`;
}
function confirmarFin(){
  const A=S.activa;
  const prevPR={};A.ejercicios.forEach(en=>prevPR[en.ex]=record(en.ex));
  const log={id:uid(),fecha:A.fecha,diaId:A.diaId,diaNombre:A.diaNombre,planN:A.planN||A.ejercicios.length,
    dur:Math.max(1,Math.round((Date.now()-A.inicio)/60000)),
    fatiga:num($('#fa').value),dolor:num($('#do').value),notas:$('#no').value,
    ejercicios:A.ejercicios.map(en=>({ex:en.ex,orig:en.orig||null,notas:en.notas,
      sets:en.sets.filter(s=>num(s.reps)>0).map(s=>({kg:num(s.kg),reps:num(s.reps),
        rir:s.rir===''?null:num(s.rir),rpe:s.rpe?num(s.rpe):null}))}))
      .filter(en=>en.sets.length)};
  if(!log.ejercicios.length){toast('No hay series registradas');return;}
  S.logs.push(log);S.activa=null;
  const prs=[];
  log.ejercicios.forEach(en=>{
    const nuevo=record(en.ex),ant=prevPR[en.ex];
    if(nuevo&&(!ant||nuevo.e1rm>ant.e1rm+0.5))prs.push(EXI[en.ex].n);
  });
  log.prs=prs;
  guardar().then(()=>{
    if(Store.modo==='memoria')toast('Sesión registrada, pero este entorno no guarda datos: exporta una copia desde Ajustes.');
  });
  cerrarSheet();SUB={};render();
  toast(prs.length?`Sesión guardada · ${prs.length} récord${prs.length>1?'s':''}: ${prs[0]}`:'Sesión guardada');
}
function verSesion(id){
  const l=S.logs.find(x=>x.id===id);if(!l)return;
  abrirSheet(`<div class="eyebrow">${parseISO(l.fecha).toLocaleDateString('es',{weekday:'long',day:'numeric',month:'long'})}</div>
   <h2 style="margin:4px 0 12px">${esc(l.diaNombre)}</h2>
   <div class="grid g4" style="margin-bottom:14px">
     <div class="stat"><div class="v">${seriesTotales(l)}</div><div class="l">Series</div></div>
     <div class="stat"><div class="v">${Math.round(tonelaje(l)).toLocaleString('es')}</div><div class="l">Kg totales</div></div>
     <div class="stat"><div class="v">${l.dur||'—'}</div><div class="l">Minutos</div></div>
     <div class="stat"><div class="v">${pct(l)}%</div><div class="l">Completada</div></div></div>
   ${l.ejercicios.map(en=>`<div style="margin-bottom:14px">
     <div class="exname">${esc(nomEx(en.ex))}</div>
     ${en.orig?`<div class="exmeta" style="color:var(--amber)">Reemplazó a ${esc(nomEx(en.orig))}</div>`:''}
     <div class="exmeta" style="font-family:var(--mono)">${en.sets.map(s=>`${s.kg}×${s.reps}${s.rir!=null?` (RIR ${s.rir})`:''}${s.rpe?` RPE ${s.rpe}`:''}`).join('  ·  ')}</div>
     ${en.notas?`<div class="cue">${esc(en.notas)}</div>`:''}</div>`).join('')}
   ${l.notas?`<div class="note" style="margin-bottom:12px">${esc(l.notas)}</div>`:''}
   <div class="exmeta">Fatiga ${l.fatiga||'—'}/10 · molestias ${l.dolor||0}/10${(l.prs||[]).length?` · récord en ${esc(l.prs.join(', '))}`:''}</div>
   <div class="sp16"></div><div class="row"><button class="btn blk" onclick="cerrarSheet()">Cerrar</button>
   <button class="btn dg blk" onclick="borrarLog('${l.id}')">Eliminar</button></div>`);
}

/* ===================== RESUMEN SEMANAL ===================== */
function resumenSemana(iso){
  const k=semanaDe(iso||hoyISO());
  const fin=new Date(parseISO(k));fin.setDate(fin.getDate()+6);
  const logs=S.logs.filter(l=>semanaDe(l.fecha)===k);
  const plan=planSemana(k);
  const previstos=plan.dias.filter(d=>d.dow<7).length;
  const vol=seriesPorMusculo(logs);
  const top=Object.entries(vol).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const dur=logs.reduce((a,l)=>a+(l.dur||0),0);
  const comp=logs.length?Math.round(logs.reduce((a,l)=>a+pct(l),0)/logs.length):0;
  const max=top.length?top[0][1]:1;
  return`<div class="card">
    <div class="between"><h3>Semana del ${fecha(k)} al ${fecha(dISO(fin))}</h3>
      <span class="tag ${logs.length>=previstos&&previstos?'acc':''}">${logs.length}/${previstos||'—'} sesiones</span></div>
    <div class="sp8"></div>${tiraSemana()}
    <div class="grid g4" style="margin-top:14px">
      <div class="stat"><div class="v">${logs.reduce((a,l)=>a+seriesTotales(l),0)}</div><div class="l">Series</div></div>
      <div class="stat"><div class="v">${Math.round(logs.reduce((a,l)=>a+tonelaje(l),0)).toLocaleString('es')}</div><div class="l">Kg movidos</div></div>
      <div class="stat"><div class="v">${dur}</div><div class="l">Minutos</div></div>
      <div class="stat"><div class="v">${comp}%</div><div class="l">Rutina completada</div></div></div>
    ${previstos?`<div class="sp16"></div><div class="prog"><i style="width:${Math.min(100,Math.round(logs.length/previstos*100))}%"></i></div>
      <div class="exmeta" style="margin-top:6px">${logs.length>=previstos?'Planificación semanal cumplida.':`Te quedan ${previstos-logs.length} sesiones para cumplir la planificación.`}</div>`:''}
    ${top.length?`<div class="divider"></div><div class="eyebrow" style="padding-bottom:8px">Grupos musculares trabajados</div>
      ${top.map(([m,v])=>`<div style="margin-bottom:8px"><div class="between"><span class="exmeta">${MUSC[m].n}</span>
        <span class="exmeta" style="font-family:var(--mono)">${round(v,1)} series</span></div>
        <div class="prog" style="margin-top:4px"><i style="width:${Math.round(v/max*100)}%"></i></div></div>`).join('')}`:''}
    ${logs.length?`<div class="divider"></div>${logs.slice().reverse().map(l=>`<div class="exrow" style="cursor:pointer" onclick="verSesion('${l.id}')">
      <div class="idx">${parseISO(l.fecha).getDate()}</div>
      <div style="flex:1"><div class="exname">${esc(l.diaNombre)}</div>
      <div class="exmeta">${DOW[parseISO(l.fecha).getDay()]} · ${seriesTotales(l)} series · ${l.dur||0} min · ${pct(l)}% completada</div></div>
      ${(l.prs||[]).length?'<span class="tag acc">PR</span>':''}</div>`).join('')}`:''}
  </div>`;
}

/* ===================== ARRANQUE ===================== */
(async function(){
  const g=await Store.load();
  S=g&&g.plan?g:nuevoEstado();
  if(!S.deloads)S.deloads=[];if(!S.medidas)S.medidas=[];
  migrarBib();migrarEquipo();
  render();
  if(!g)guardar();
})();
</script>
