<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f1a14">
<title>Mi Rutina</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f1a14;--surf:#162010;--surf2:#1c2a18;--surf3:#243020;
  --border:#2a3a24;--border2:#354830;
  --text:#e8f0e4;--text2:#a8baa0;--text3:#6a7e62;
  --green:#4ade80;--green-d:#22c55e;--green-dk:#166534;--gbg:#14291e;--gt:#bbf7d0;
  --blue:#60a5fa;--bbg:#1e2d4a;--btext:#bfdbfe;
  --purple:#c084fc;--pbg:#2d1b4a;--ptext:#e9d5ff;
  --amber:#fbbf24;--abg:#2d2000;--atext:#fde68a;
  --red:#f87171;--rbg:#2d1414;
  --pink:#f472b6;--pinkbg:#2d1428;--pinktext:#fce7f3;
  --r:14px;--rs:10px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);font-family:'DM Sans',sans-serif;color:var(--text);overscroll-behavior:none}
.app{max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:90px}

/* PROFILE PICKER */
.profile-screen{position:fixed;inset:0;background:var(--bg);z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px;gap:20px}
.profile-screen.hidden{display:none}
.profile-logo{width:56px;height:56px;border-radius:16px;background:var(--green-dk);display:flex;align-items:center;justify-content:center;margin-bottom:4px}
.profile-logo svg{width:28px;height:28px;stroke:var(--green);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.profile-title{font-family:'DM Serif Display',serif;font-size:26px;color:var(--text);text-align:center}
.profile-sub{font-size:13px;color:var(--text3);text-align:center;margin-top:-8px}
.profile-cards{display:flex;flex-direction:column;gap:12px;width:100%;max-width:320px}
.profile-card{border-radius:var(--r);padding:18px 20px;cursor:pointer;display:flex;align-items:center;gap:14px;border:2px solid transparent;transition:all .2s;-webkit-user-select:none;user-select:none}
.profile-card.sofia{background:var(--pinkbg);border-color:#4a1a38}
.profile-card.sofia:hover,.profile-card.sofia:active{border-color:var(--pink)}
.profile-card.pareja{background:var(--bbg);border-color:#1a2a4a}
.profile-card.pareja:hover,.profile-card.pareja:active{border-color:var(--blue)}
.profile-avatar{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.profile-card.sofia .profile-avatar{background:#4a1a38}
.profile-card.pareja .profile-avatar{background:#1a2a4a}
.profile-card-info{flex:1}
.profile-card-name{font-size:16px;font-weight:600}
.profile-card.sofia .profile-card-name{color:var(--pinktext)}
.profile-card.pareja .profile-card-name{color:var(--btext)}
.profile-card-sub{font-size:11px;color:var(--text3);margin-top:2px}

/* HEADER */
.hdr{background:linear-gradient(160deg,#162010 0%,#0f1a14 100%);border-bottom:1px solid var(--border);padding:14px 16px 11px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10}
.hdr-logo{width:34px;height:34px;border-radius:10px;background:var(--green-dk);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.hdr-logo svg{width:18px;height:18px;stroke:var(--green);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hdr-info{flex:1;min-width:0}
.hdr h1{font-family:'DM Serif Display',serif;font-size:18px;color:var(--text);letter-spacing:-.3px}
.hdr-sub{font-size:11px;color:var(--text3);margin-top:1px}
.hdr-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.wk-badge{font-size:11px;font-weight:600;padding:4px 10px;border-radius:20px;background:var(--green-dk);color:var(--gt);white-space:nowrap}
.switch-btn{padding:5px 10px;border-radius:20px;border:1.5px solid var(--border2);background:none;font-size:11px;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif;white-space:nowrap;transition:all .15s}
.switch-btn.sofia-btn{color:var(--pink);border-color:#4a1a38}
.switch-btn.pareja-btn{color:var(--blue);border-color:#1a2a4a}
.user-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:4px;vertical-align:middle}
.sofia-dot{background:var(--pink)}
.pareja-dot{background:var(--blue)}

/* NAV */
.nav{display:flex;background:var(--surf);border-bottom:1px solid var(--border);position:sticky;top:62px;z-index:9}
.nb{flex:1;padding:10px 2px 9px;border:none;background:none;font-size:10px;color:var(--text3);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;border-bottom:2px solid transparent;font-family:'DM Sans',sans-serif;font-weight:500;letter-spacing:.2px;transition:color .15s}
.nb svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.nb.on{color:var(--green);border-bottom-color:var(--green)}
.tab{display:none}.tab.on{display:block}

/* DAY CARDS */
.day-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:14px 14px 6px}
.day-btn{border:1px solid var(--border);border-radius:var(--r);padding:13px 12px;background:var(--surf);cursor:pointer;text-align:left;-webkit-user-select:none;user-select:none;transition:all .15s;position:relative;overflow:hidden}
.day-btn.active{border-color:var(--green-d);background:var(--gbg)}
.day-btn.done-day{border-color:var(--green-dk)}
.day-num{font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-bottom:4px}
.day-btn.active .day-num{color:var(--green)}
.dlabel{font-size:13px;font-weight:600;color:var(--text);line-height:1.3}
.day-btn.active .dlabel{color:var(--gt)}
.dsub{font-size:10px;color:var(--text3);margin-top:3px;line-height:1.4}
.day-btn.active .dsub{color:var(--green-d)}
.day-check{position:absolute;top:10px;right:10px;width:18px;height:18px;border-radius:50%;background:var(--green-dk);display:flex;align-items:center;justify-content:center;opacity:0}
.day-btn.done-day .day-check{opacity:1}
.day-check svg{width:10px;height:10px;stroke:var(--green);fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}

/* PROFILE BAND */
.profile-band{display:flex;align-items:center;gap:8px;padding:10px 14px 2px;font-size:12px;color:var(--text3)}
.profile-band-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.profile-band-name{font-weight:600}
.sofia-band .profile-band-dot{background:var(--pink)}
.sofia-band .profile-band-name{color:var(--pink)}
.pareja-band .profile-band-dot{background:var(--blue)}
.pareja-band .profile-band-name{color:var(--blue)}

/* PROGRESS */
.prog-wrap{padding:10px 14px 8px}
.prog-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.prog-lbl{font-size:12px;color:var(--text2);font-weight:500}
.prog-pct{font-size:12px;font-weight:600;color:var(--green)}
.prog-track{height:5px;background:var(--border);border-radius:3px;overflow:hidden}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--green-dk),var(--green));border-radius:3px;transition:width .4s ease}
.sec-lbl{padding:14px 14px 5px;font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;display:flex;align-items:center;gap:8px}
.sec-lbl::after{content:"";flex:1;height:1px;background:var(--border)}

/* EXERCISE CARDS */
.ex-card{background:var(--surf);border:1px solid var(--border);border-radius:var(--r);margin:5px 14px;overflow:hidden;transition:border-color .15s}
.ex-card.open{border-color:var(--border2)}
.ex-head{padding:12px 14px;display:flex;align-items:center;gap:12px;cursor:pointer;-webkit-user-select:none;user-select:none}
.ex-icon{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ex-icon svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.ex-info{flex:1;min-width:0}
.ex-name{font-size:13px;font-weight:600;line-height:1.3;color:var(--text)}
.ex-meta{display:flex;gap:5px;margin-top:4px;flex-wrap:wrap}
.badge{font-size:10px;font-weight:600;padding:2px 8px;border-radius:20px;letter-spacing:.2px}
.b-s{background:var(--bbg);color:var(--btext)}.b-r{background:var(--pbg);color:var(--ptext)}
.b-comp{background:var(--bbg);color:var(--btext)}.b-iso{background:var(--pbg);color:var(--ptext)}
.b-done{background:var(--green-dk);color:var(--gt)}
.chev{color:var(--text3);flex-shrink:0;transition:transform .25s ease}
.chev svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ex-card.open .chev{transform:rotate(180deg)}
.ex-body{display:none;border-top:1px solid var(--border);padding:14px}
.ex-card.open .ex-body{display:block}
.tip-box{background:var(--surf2);border-left:3px solid var(--green-dk);border-radius:0 var(--rs) var(--rs) 0;padding:10px 12px;font-size:12px;color:var(--text2);line-height:1.6;margin-bottom:14px}

/* SETS */
.set-hdrs{display:grid;grid-template-columns:28px 1fr 1fr 36px;gap:8px;margin-bottom:6px;padding:0 2px}
.sh{font-size:10px;color:var(--text3);text-align:center;font-weight:600;letter-spacing:.4px;text-transform:uppercase}
.sets-cont{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.set-row{display:grid;grid-template-columns:28px 1fr 1fr 36px;gap:8px;align-items:center}
.set-row.done-row{opacity:.55}
.sn{font-size:11px;font-weight:600;color:var(--text3);text-align:center}
.sinp{width:100%;font-size:14px;font-weight:500;padding:8px;border:1px solid var(--border2);border-radius:var(--rs);background:var(--surf2);color:var(--text);text-align:center;-webkit-appearance:none;font-family:'DM Sans',sans-serif;transition:border-color .15s}
.sinp:focus{outline:none;border-color:var(--green-d);background:var(--surf3)}
.schk{width:36px;height:36px;border-radius:var(--rs);border:1.5px solid var(--border2);background:var(--surf2);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text3);transition:all .15s}
.schk svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.schk.done{background:var(--green-dk);border-color:var(--green-d);color:var(--green)}
.add-btn{width:100%;padding:8px;border:1.5px dashed var(--border2);border-radius:var(--rs);background:none;color:var(--text3);font-size:12px;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif;margin-bottom:2px}
.finish-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:calc(100% - 28px);margin:14px;padding:14px;background:linear-gradient(135deg,var(--green-dk),#1a7a3a);color:var(--gt);border:none;border-radius:var(--r);font-size:14px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;box-shadow:0 4px 16px rgba(34,197,94,.2);transition:all .15s}
.finish-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.finish-btn:active{opacity:.85}
.empty-day{text-align:center;padding:40px 20px;color:var(--text3)}
.empty-day svg{width:48px;height:48px;stroke:currentColor;fill:none;stroke-width:1;margin:0 auto 12px;display:block;color:var(--border2)}

/* BUILDER */
.build-hero{background:linear-gradient(135deg,var(--surf) 0%,var(--gbg) 100%);border-bottom:1px solid var(--border);padding:14px 14px 12px}
.build-hero-title{font-family:'DM Serif Display',serif;font-size:17px;color:var(--text);margin-bottom:2px}
.build-hero-sub{font-size:11px;color:var(--text3)}
.pill-row{display:flex;gap:7px;padding:0 14px;overflow-x:auto;scrollbar-width:none;margin-bottom:2px}
.pill-row::-webkit-scrollbar{display:none}
.pill{padding:7px 14px;border:1.5px solid var(--border2);border-radius:20px;background:var(--surf);font-size:12px;font-weight:500;cursor:pointer;white-space:nowrap;color:var(--text2);font-family:'DM Sans',sans-serif;transition:all .15s}
.pill.on{background:var(--green-dk);color:var(--gt);border-color:var(--green-d)}
.muscle-pill{padding:6px 12px;border:1.5px solid var(--border2);border-radius:20px;background:var(--surf);font-size:11px;font-weight:500;cursor:pointer;white-space:nowrap;color:var(--text2);font-family:'DM Sans',sans-serif;transition:all .15s}
.muscle-pill.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.cfg-box{margin:8px 14px;background:var(--surf);border:1px solid var(--border);border-radius:var(--r);padding:12px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.cfg-lbl{font-size:12px;color:var(--text2);font-weight:500;flex-shrink:0}
.cfg-inp{width:62px;font-size:14px;font-weight:500;padding:7px 8px;border:1px solid var(--border2);border-radius:var(--rs);background:var(--surf2);color:var(--text);text-align:center;font-family:'DM Sans',sans-serif}
.rep-sel{font-size:12px;padding:7px 10px;border:1px solid var(--border2);border-radius:var(--rs);background:var(--surf2);color:var(--text);flex:1;min-width:120px;-webkit-appearance:none;font-family:'DM Sans',sans-serif}
.ex-list{padding:0 14px;display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.eli{background:var(--surf);border:1.5px solid var(--border);border-radius:var(--r);padding:11px 12px;display:flex;align-items:flex-start;gap:11px;cursor:pointer;-webkit-user-select:none;user-select:none;transition:all .15s}
.eli.selected{border-color:var(--green-d);background:var(--gbg)}
.eli-chk{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--border2);display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;color:transparent;transition:all .15s}
.eli-chk svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.eli.selected .eli-chk{background:var(--green-d);border-color:var(--green-d);color:#fff}
.eli-info{flex:1;min-width:0}
.eli-name{font-size:13px;font-weight:600;color:var(--text)}.eli.selected .eli-name{color:var(--gt)}
.eli-meta{display:flex;gap:5px;margin-top:3px;flex-wrap:wrap}
.eli-tip{font-size:11px;color:var(--text3);margin-top:4px;line-height:1.5}
.sel-lbl{padding:10px 14px 5px;font-size:11px;color:var(--text3);font-weight:500}
.sel-pills-wrap{padding:0 14px;display:flex;flex-direction:column;gap:5px;margin-bottom:6px}
.sel-pill{display:flex;align-items:center;gap:8px;background:var(--surf);border:1px solid var(--border);border-radius:var(--rs);padding:8px 12px}
.sel-pill-name{font-size:12px;font-weight:500;flex:1;color:var(--text)}
.sel-pill-rm{background:none;border:none;cursor:pointer;color:var(--text3);font-size:18px;line-height:1;padding:0 3px}
.save-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:calc(100% - 28px);margin:10px 14px 5px;padding:13px;background:linear-gradient(135deg,#1a3a6a,#1e4a8c);color:var(--btext);border:none;border-radius:var(--r);font-size:14px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .15s}
.save-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.reset-btn{display:block;width:calc(100% - 28px);margin:0 14px 16px;padding:10px;border:1px solid var(--border2);border-radius:var(--r);background:none;font-size:12px;color:var(--text3);cursor:pointer;text-align:center;font-family:'DM Sans',sans-serif}

/* HISTORIAL */
.hist-card{background:var(--surf);border:1px solid var(--border);border-radius:var(--r);margin:6px 14px;padding:14px}
.hdate{font-size:12px;font-weight:600;color:var(--text);display:flex;align-items:center;gap:8px}
.hdate-badge{font-size:10px;background:var(--green-dk);color:var(--gt);padding:2px 8px;border-radius:20px;font-weight:600}
.hday{font-size:11px;color:var(--text3);margin:3px 0 10px}
.hex{font-size:12px;color:var(--text2);display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid var(--border)}.hex:last-child{border-bottom:none}
.hex-val{color:var(--green);font-size:11px;font-weight:600}

/* STATS */
.stats-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:14px}
.scard{background:var(--surf);border:1px solid var(--border);border-radius:var(--r);padding:14px;text-align:center}
.snum{font-family:'DM Serif Display',serif;font-size:32px;color:var(--green);line-height:1.1}.slbl{font-size:11px;color:var(--text3);margin-top:3px;font-weight:500}
.pr-list{padding:0 14px 14px;display:flex;flex-direction:column;gap:6px}
.pr-item{background:var(--surf);border:1px solid var(--border);border-radius:var(--rs);padding:11px 14px;display:flex;align-items:center;justify-content:space-between}
.pr-left{flex:1;min-width:0}
.pr-n{font-size:13px;font-weight:600;color:var(--text)}.pr-d{font-size:10px;color:var(--text3);margin-top:2px}
.pr-v{font-size:16px;color:var(--green);font-weight:700;margin-left:12px;white-space:nowrap}
.no-data{padding:16px 14px;font-size:13px;color:var(--text3)}
.empty{text-align:center;padding:48px 24px;color:var(--text3)}
.empty svg{width:48px;height:48px;stroke:currentColor;fill:none;stroke-width:1;margin:0 auto 12px;display:block}
</style>
</head>
<body>

<!-- PROFILE PICKER -->
<div class="profile-screen" id="profile-screen">
  <div class="profile-logo">
    <svg viewBox="0 0 24 24"><line x1="6" y1="12" x2="18" y2="12"/><circle cx="4" cy="12" r="2"/><circle cx="20" cy="12" r="2"/></svg>
  </div>
  <div class="profile-title">Mi Rutina</div>
  <div class="profile-sub">Selecciona tu perfil para continuar</div>
  <div class="profile-cards">
    <div class="profile-card sofia" data-p="sofia" onclick="selectProfile(this.dataset.p)">
      <div class="profile-avatar">&#127801;</div>
      <div class="profile-card-info">
        <div class="profile-card-name">Sof&iacute;a</div>
        <div class="profile-card-sub">Tu rutina y progreso personal</div>
      </div>
    </div>
    <div class="profile-card pareja" data-p="pareja" onclick="selectProfile(this.dataset.p)">
      <div class="profile-avatar">&#128170;</div>
      <div class="profile-card-info">
        <div class="profile-card-name">Cristóbal</div>
        <div class="profile-card-sub">Su rutina y progreso personal</div>
      </div>
    </div>
  </div>
</div>

<div class="app" id="main-app" style="display:none">
  <div class="hdr">
    <div class="hdr-logo">
      <svg viewBox="0 0 24 24"><line x1="6" y1="12" x2="18" y2="12"/><circle cx="4" cy="12" r="2"/><circle cx="20" cy="12" r="2"/></svg>
    </div>
    <div class="hdr-info">
      <h1 id="hdr-title">Mi Rutina</h1>
      <div class="hdr-sub" id="hdr-sub">Semana 1 &middot; 0/4 dias</div>
    </div>
    <div class="hdr-right">
      <div class="wk-badge" id="wk-badge">Sem. 1</div>
      <button class="switch-btn" id="switch-btn" onclick="switchProfile()"></button>
    </div>
  </div>
  <nav class="nav">
    <button class="nb on" id="nb-rutina" data-tab="rutina" onclick="showTab(this.dataset.tab)">
      <svg viewBox="0 0 24 24"><line x1="6" y1="12" x2="18" y2="12"/><circle cx="4" cy="12" r="2"/><circle cx="20" cy="12" r="2"/></svg>
      Rutina
    </button>
    <button class="nb" id="nb-build" data-tab="build" onclick="showTab(this.dataset.tab)">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><line x1="14" y1="17.5" x2="21" y2="17.5"/><line x1="17.5" y1="14" x2="17.5" y2="21"/></svg>
      Construir
    </button>
    <button class="nb" id="nb-historial" data-tab="historial" onclick="showTab(this.dataset.tab)">
      <svg viewBox="0 0 24 24"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-4.5"/></svg>
      Historial
    </button>

// ── STATE: currentProfile + per-profile data ──
var currentProfile = null;

// Per-profile state stored in localStorage under key "rutina_v7_sofia" / "rutina_v7_pareja"
var P = {}; // active profile data: {day, week, sets, history, doneDays, prs, custom}
var UI = {buildDay:"A", buildFilter:"espalda", buildSel:[]};

function defaultState(){
  return {day:"A", week:1, sets:{}, history:[], doneDays:[], prs:{}, custom:{}};
}

function loadProfile(profileKey){
  try{
    var d=localStorage.getItem("rutina_v7_"+profileKey);
    if(d) return JSON.parse(d);
  }catch(e){}
  return defaultState();
}

function saveProfile(){
  if(!currentProfile)return;
  try{
    localStorage.setItem("rutina_v7_"+currentProfile, JSON.stringify(P));
  }catch(e){}
}

function selectProfile(profileKey){
  currentProfile = profileKey;
  P = loadProfile(profileKey);
  document.getElementById("profile-screen").classList.add("hidden");
  document.getElementById("main-app").style.display="block";
  updateProfileUI();
  showTab("rutina");
}

function switchProfile(){
  saveProfile();
  document.getElementById("main-app").style.display="none";
  document.getElementById("profile-screen").classList.remove("hidden");
  currentProfile = null;
}

function updateProfileUI(){
  var prof = PROFILES[currentProfile];
  document.getElementById("hdr-title").textContent = prof.emoji+" "+prof.name;
  var btn = document.getElementById("switch-btn");
  btn.className = "switch-btn "+prof.btnClass;
  var other = currentProfile==="sofia" ? PROFILES.pareja : PROFILES.sofia;
  btn.innerHTML = '<span class="user-dot '+(currentProfile==="sofia"?"pareja-dot":"sofia-dot")+'"></span>'+other.name;
  document.getElementById("build-hero-sub").textContent = "Rutina personal de "+prof.name;
  updateHdr();
}

// Getters that delegate to P (active profile)
function getSD(dk,eid,si){return P.sets[dk+"_"+eid+"_"+si]||{kg:"",reps:"",done:false};}
function setSD(dk,eid,si,f,v){var k=dk+"_"+eid+"_"+si;if(!P.sets[k])P.sets[k]={kg:"",reps:"",done:false};P.sets[k][f]=v;saveProfile();}
function findEx(id){for(var i=0;i<MASTER.length;i++){if(MASTER[i].id===id)return MASTER[i];}return null;}
function getDayExs(dk){if(P.custom[dk])return P.custom[dk];for(var i=0;i<BASE.length;i++){if(BASE[i].key===dk)return BASE[i].exs;}return[];}
function getDayLabel(dk){for(var i=0;i<BASE.length;i++){if(BASE[i].key===dk)return BASE[i].label;}return"Dia "+dk;}
function getDaySub(dk){
  if(P.custom[dk]){var gs=[];P.custom[dk].forEach(function(e){var m=findEx(e.id);if(m&&gs.indexOf(m.g)<0)gs.push(m.g);});return gs.slice(0,3).join(" + ");}
  for(var i=0;i<BASE.length;i++){if(BASE[i].key===dk)return BASE[i].sub;}return"";
}

function showTab(t){
  ["rutina","build","historial","stats"].forEach(function(x){
    document.getElementById("tab-"+x).classList.toggle("on",x===t);
    document.getElementById("nb-"+x).classList.toggle("on",x===t);
  });
  if(t==="rutina"){renderDays();renderRutina();}
  if(t==="build")renderBuild();
  if(t==="historial")renderHist();
  if(t==="stats")renderStats();
}

function calcProg(dk){
  var exs=getDayExs(dk);var total=0,done=0;
  for(var i=0;i<exs.length;i++){
    var extra=parseInt(P.sets[dk+"_"+exs[i].id+"_extra"])||0;
    var ts=exs[i].s+extra;
    for(var j=0;j<ts;j++){total++;if(getSD(dk,exs[i].id,j).done)done++;}
  }
  return{total:total,done:done,pct:total>0?Math.round(done/total*100):0};
}

function svgCheck(){return'<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>';}
function svgDown(){return'<svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>';}

function renderDays(){
  var keys=["A","B","C","D"];var html="";
  for(var i=0;i<keys.length;i++){
    var k=keys[i];
    var isDone=P.doneDays.indexOf(k)>=0;
    var isAct=P.day===k;
    var cls="day-btn"+(isAct?" active":"")+(isDone?" done-day":"");
    html+='<button class="'+cls+'" data-key="'+k+'" onclick="selDay(this.dataset.key)">';
    html+='<div class="day-num">'+getDayLabel(k)+(P.custom&&P.custom[k]?" *":"")+'</div>';
    html+='<div class="dlabel">'+getDaySub(k)+'</div>';
    html+='<div class="day-check"><svg viewBox="0 0 24 24" style="width:10px;height:10px;stroke:var(--green);fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round"><polyline points="20 6 9 17 4 12"/></svg></div>';
    html+='</button>';
  }
  document.getElementById("day-row").innerHTML=html;
}

function selDay(k){P.day=k;saveProfile();renderDays();renderRutina();}

function renderRutina(){
  var dk=P.day;
  var exs=getDayExs(dk);
  var prog=calcProg(dk);
  var label=getDayLabel(dk);
  var sub=getDaySub(dk);
  var grupos=[];
  for(var i=0;i<exs.length;i++){var m=findEx(exs[i].id);var g=m?m.g:"otro";if(grupos.indexOf(g)<0)grupos.push(g);}

  var prof=PROFILES[currentProfile];
  var html='<div class="profile-band '+(currentProfile==="sofia"?"sofia-band":"pareja-band")+'">';
  html+='<div class="profile-band-dot"></div>';
  html+='<span class="profile-band-name">'+prof.name+'</span>';
  html+='<span> &mdash; '+label+'</span>';
  html+='</div>';

  html+='<div class="prog-wrap">';
  html+='<div class="prog-top"><span class="prog-lbl">'+sub+'</span><span class="prog-pct">'+prog.pct+'%</span></div>';
  html+='<div class="prog-track"><div class="prog-fill" id="pfill" style="width:'+prog.pct+'%"></div></div></div>';

  for(var gi=0;gi<grupos.length;gi++){
    var g=grupos[gi];
    html+='<div class="sec-lbl">'+g+'</div>';
    for(var ei=0;ei<exs.length;ei++){
      var exCfg=exs[ei];var ex=findEx(exCfg.id);
      if(!ex||ex.g!==g)continue;
      var extra=parseInt(P.sets[dk+"_"+ex.id+"_extra"])||0;
      var ts=exCfg.s+extra;
      var col=GCOL[ex.g]||{ic:"#60a5fa",ib:"#1e2d4a"};
      var allDone=true;
      for(var si=0;si<ts;si++){if(!getSD(dk,ex.id,si).done){allDone=false;break;}}

      var shtml='<div class="set-hdrs"><div class="sh">Set</div><div class="sh">Kg</div><div class="sh">Reps</div><div class="sh"></div></div>';
      shtml+='<div class="sets-cont">';
      for(var si=0;si<ts;si++){
        var sd=getSD(dk,ex.id,si);
        shtml+='<div class="set-row'+(sd.done?" done-row":"")+'">';
        shtml+='<div class="sn">'+(si+1)+'</div>';
        shtml+='<input class="sinp" type="number" inputmode="decimal" min="0" step="0.5" placeholder="&mdash;" value="'+sd.kg+'" data-dk="'+dk+'" data-eid="'+ex.id+'" data-si="'+si+'" data-f="kg" onchange="handleInput(this)">';
        shtml+='<input class="sinp" type="number" inputmode="numeric" min="0" step="1" placeholder="&mdash;" value="'+sd.reps+'" data-dk="'+dk+'" data-eid="'+ex.id+'" data-si="'+si+'" data-f="reps" onchange="handleInput(this)">';
        shtml+='<button class="schk'+(sd.done?" done":"")+'" data-dk="'+dk+'" data-eid="'+ex.id+'" data-si="'+si+'" onclick="togDone(this)">'+svgCheck()+'</button>';
        shtml+='</div>';
      }
      shtml+='</div>';

      html+='<div class="ex-card" id="exc_'+ex.id+'">';
      html+='<div class="ex-head" data-id="'+ex.id+'" onclick="toggleCard(this.dataset.id)">';
      html+='<div class="ex-icon" style="background:'+col.ib+';color:'+col.ic+'">';
      html+='<svg viewBox="0 0 24 24" style="width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round"><line x1="6" y1="12" x2="18" y2="12"/><circle cx="4" cy="12" r="2"/><circle cx="20" cy="12" r="2"/></svg></div>';
      html+='<div class="ex-info"><div class="ex-name">'+ex.n+'</div>';
      html+='<div class="ex-meta"><span class="badge b-s">'+ts+' series</span><span class="badge b-r">'+exCfg.r+'</span>';
      html+='<span class="badge '+(ex.tipo==="compuesto"?"b-comp":"b-iso")+'">'+ex.tipo+'</span>';
      if(allDone)html+='<span class="badge b-done">&#10003; completo</span>';
      html+='</div></div>';
      html+='<div class="chev">'+svgDown()+'</div></div>';
      html+='<div class="ex-body"><div class="tip-box">'+ex.tip+'</div>';
      html+=shtml;
      html+='<button class="add-btn" data-dk="'+dk+'" data-eid="'+ex.id+'" onclick="addSet(this)">+ Agregar serie</button>';
      html+='</div></div>';
    }
  }

  if(!exs.length){
    html+='<div class="empty-day"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><line x1="14" y1="17.5" x2="21" y2="17.5"/><line x1="17.5" y1="14" x2="17.5" y2="21"/></svg>';
    html+='<div style="font-weight:600;font-size:14px;margin-bottom:6px">Sin ejercicios</div>';
    html+='<div style="font-size:12px">Ve a Construir para agregar ejercicios</div></div>';
  }

  html+='<button class="finish-btn" data-dk="'+dk+'" onclick="finishDay(this.dataset.dk)">';
  html+='<svg viewBox="0 0 24 24"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>';
  html+='Completar '+label+'</button>';
  document.getElementById("rutina-content").innerHTML=html;
  updateHdr();
}

function handleInput(el){
  setSD(el.dataset.dk,el.dataset.eid,parseInt(el.dataset.si),el.dataset.f,el.value);
  if(el.dataset.f==="kg")updPR(el.dataset.dk,el.dataset.eid);
}

function toggleCard(id){
  var card=document.getElementById("exc_"+id);
  if(card)card.classList.toggle("open");
}

function togDone(btn){
  var dk=btn.dataset.dk,eid=btn.dataset.eid,si=parseInt(btn.dataset.si);
  var k=dk+"_"+eid+"_"+si;
  if(!P.sets[k])P.sets[k]={kg:"",reps:"",done:false};
  P.sets[k].done=!P.sets[k].done;
  saveProfile();
  btn.classList.toggle("done",P.sets[k].done);
  var row=btn.closest(".set-row");
  if(row)row.classList.toggle("done-row",P.sets[k].done);
  var prog=calcProg(dk);
  var pf=document.getElementById("pfill");
  var pp=document.querySelector(".prog-pct");
  if(pf)pf.style.width=prog.pct+"%";
  if(pp)pp.textContent=prog.pct+"%";
  refreshDoneBadge(dk,eid);
}

function refreshDoneBadge(dk,eid){
  var exs=getDayExs(dk);var exCfg=null;
  for(var i=0;i<exs.length;i++){if(exs[i].id===eid){exCfg=exs[i];break;}}
  if(!exCfg)return;
  var extra=parseInt(P.sets[dk+"_"+eid+"_extra"])||0;
  var ts=exCfg.s+extra;var allDone=true;
  for(var i=0;i<ts;i++){if(!getSD(dk,eid,i).done){allDone=false;break;}}
  var meta=document.querySelector("#exc_"+eid+" .ex-meta");if(!meta)return;
  var b=meta.querySelector(".b-done");
  if(allDone&&!b){var s=document.createElement("span");s.className="badge b-done";s.textContent="\u2713 completo";meta.appendChild(s);}
  else if(!allDone&&b)b.remove();
}

function addSet(btn){
  var dk=btn.dataset.dk,eid=btn.dataset.eid;
  var k=dk+"_"+eid+"_extra";
  P.sets[k]=(parseInt(P.sets[k])||0)+1;
  saveProfile();renderRutina();
  setTimeout(function(){var c=document.getElementById("exc_"+eid);if(c)c.classList.add("open");},60);
}

function updPR(dk,eid){
  var max=0,prefix=dk+"_"+eid+"_";
  Object.keys(P.sets).forEach(function(k){
    if(k.indexOf(prefix)===0&&k.indexOf("extra")<0){var v=parseFloat(P.sets[k].kg||0);if(v>max)max=v;}
  });
  if(max>0){var curr=P.prs[eid]||{kg:0};if(max>curr.kg){P.prs[eid]={kg:max,date:new Date().toLocaleDateString("es-CL")};saveProfile();}}
}

function finishDay(dk){
  var prog=calcProg(dk);var label=getDayLabel(dk);var sub=getDaySub(dk);var exs=getDayExs(dk);
  if(P.doneDays.indexOf(dk)<0)P.doneDays.push(dk);
  var entryExs=[];
  for(var i=0;i<exs.length;i++){
    var exCfg=exs[i];var ex=findEx(exCfg.id);if(!ex)continue;
    var extra=parseInt(P.sets[dk+"_"+ex.id+"_extra"])||0;var ts=exCfg.s+extra;var sets=[];
    for(var j=0;j<ts;j++){var sd=getSD(dk,ex.id,j);if(sd.kg||sd.reps)sets.push(sd);}
    if(sets.length>0)entryExs.push({n:ex.n,sets:sets});
  }
  P.history.unshift({date:new Date().toLocaleDateString("es-CL"),dayKey:dk,dayLabel:label,dayName:sub,week:P.week,exs:entryExs});
  if(P.history.length>80)P.history.pop();
  if(P.doneDays.length>=4){P.week++;P.doneDays=[];}
  saveProfile();renderDays();updateHdr();
  alert(label+" completado "+(prog.pct===100?"al 100%! Excelente sesion":"con "+prog.pct+"% de series")+". Guardado.");
}

function updateHdr(){
  if(!currentProfile)return;
  document.getElementById("hdr-sub").textContent="Semana "+P.week+" \u00b7 "+P.doneDays.length+"/4 dias";
  document.getElementById("wk-badge").textContent="Sem. "+P.week;
}

// ── BUILDER ──
function renderBuild(){
  var keys=["A","B","C","D"];var html="";
  for(var i=0;i<keys.length;i++){
    var k=keys[i];var cust=P.custom&&P.custom[k]?" (*)":"";
    html+='<button class="pill'+(UI.buildDay===k?" on":"")+'" data-k="'+k+'" onclick="setBuildDay(this.dataset.k)">'+getDayLabel(k)+cust+'</button>';
  }
  document.getElementById("build-day-row").innerHTML=html;
  html="";
  for(var i=0;i<GRUPOS.length;i++){
    var g=GRUPOS[i];
    html+='<button class="muscle-pill'+(UI.buildFilter===g?" on":"")+'" data-g="'+g+'" onclick="setBuildFilter(this.dataset.g)">'+g+'</button>';
  }
  document.getElementById("mtabs").innerHTML=html;
  renderExList();renderSelExs();
}

function setBuildDay(k){UI.buildDay=k;renderBuild();}
function setBuildFilter(g){UI.buildFilter=g;renderExList();}

function renderExList(){
  var filtered=[];
  for(var i=0;i<MASTER.length;i++){if(MASTER[i].g===UI.buildFilter)filtered.push(MASTER[i]);}
  var html="";
  for(var i=0;i<filtered.length;i++){
    var ex=filtered[i];
    var sel=false;
    for(var j=0;j<UI.buildSel.length;j++){if(UI.buildSel[j].id===ex.id){sel=true;break;}}
    html+='<div class="eli'+(sel?" selected":"")+'" data-id="'+ex.id+'" onclick="togBuildEx(this.dataset.id)">';
    html+='<div class="eli-chk">'+svgCheck()+'</div>';
    html+='<div class="eli-info"><div class="eli-name">'+ex.n+'</div>';
    html+='<div class="eli-meta"><span class="badge '+(ex.tipo==="compuesto"?"b-comp":"b-iso")+'">'+ex.tipo+'</span>';
    html+='<span class="badge b-r">'+ex.defR+'</span></div>';
    html+='<div class="eli-tip">'+ex.tip.substring(0,80)+'&hellip;</div>';
    html+='</div></div>';
  }
  document.getElementById("ex-list").innerHTML=html;
}

function togBuildEx(id){
  var idx=-1;
  for(var i=0;i<UI.buildSel.length;i++){if(UI.buildSel[i].id===id){idx=i;break;}}
  if(idx>=0){UI.buildSel.splice(idx,1);}
  else{
    var sets=parseInt(document.getElementById("cfg-sets").value)||3;
    var reps=document.getElementById("cfg-reps").value||"8-10";
    UI.buildSel.push({id:id,s:sets,r:reps});
  }
  renderExList();renderSelExs();
}

function renderSelExs(){
  var w=document.getElementById("sel-wrap");
  if(!UI.buildSel.length){w.innerHTML="";return;}
  var html='<div class="sel-lbl">'+UI.buildSel.length+' ejercicio(s) para '+getDayLabel(UI.buildDay)+'</div>';
  html+='<div class="sel-pills-wrap">';
  for(var i=0;i<UI.buildSel.length;i++){
    var s=UI.buildSel[i];var ex=findEx(s.id);
    html+='<div class="sel-pill">';
    html+='<span class="sel-pill-name">'+(ex?ex.n:s.id)+'</span>';
    html+='<span class="badge b-s" style="margin-right:4px">'+s.s+'x</span>';
    html+='<span class="badge b-r">'+s.r+'</span>';
    html+='<button class="sel-pill-rm" data-id="'+s.id+'" onclick="rmBuildEx(this.dataset.id)">&times;</button>';
    html+='</div>';
  }
  html+='</div>';
  w.innerHTML=html;
}

function rmBuildEx(id){
  UI.buildSel=UI.buildSel.filter(function(s){return s.id!==id;});
  renderExList();renderSelExs();
}

function saveBuiltDay(){
  if(!UI.buildSel.length){alert("Selecciona al menos un ejercicio.");return;}
  if(!P.custom)P.custom={};
  P.custom[UI.buildDay]=UI.buildSel.slice();
  UI.buildSel=[];saveProfile();
  renderDays();renderBuild();
  alert(getDayLabel(UI.buildDay)+" guardado con "+P.custom[UI.buildDay].length+" ejercicios.");
  showTab("rutina");selDay(UI.buildDay);
}

function resetDay(){
  if(confirm("Restaurar "+getDayLabel(UI.buildDay)+" a la rutina base?")){
    delete P.custom[UI.buildDay];UI.buildSel=[];saveProfile();
    renderDays();renderBuild();renderRutina();
  }
}

// ── HISTORIAL ──
function renderHist(){
  var c=document.getElementById("hist-content");
  if(!P.history.length){
    c.innerHTML='<div class="empty"><svg viewBox="0 0 24 24"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-4.5"/></svg><div style="font-size:14px;font-weight:600;margin-bottom:6px">Sin sesiones aun</div></div>';
    return;
  }
  var html='<div class="sec-lbl" style="padding-top:14px">Sesiones de '+PROFILES[currentProfile].name+'</div>';
  var limit=Math.min(P.history.length,25);
  for(var i=0;i<limit;i++){
    var e=P.history[i];
    html+='<div class="hist-card"><div class="hdate">'+e.date+'<span class="hdate-badge">Sem. '+e.week+'</span></div>';
    html+='<div class="hday">'+e.dayLabel+' &mdash; '+e.dayName+'</div>';
    for(var j=0;j<e.exs.length;j++){
      var ex=e.exs[j];var best={kg:0,reps:0};
      for(var k2=0;k2<ex.sets.length;k2++){if(parseFloat(ex.sets[k2].kg||0)>parseFloat(best.kg||0))best=ex.sets[k2];}
      html+='<div class="hex">'+ex.n+'<span class="hex-val">'+(best.kg?best.kg+' kg &times; '+best.reps:"&mdash;")+'</span></div>';
    }
    html+='</div>';
  }
  c.innerHTML=html;
}

// ── STATS ──
function renderStats(){
  var total=P.history.length;var sets=0;var vol=0;
  Object.values(P.sets).forEach(function(v){if(v&&v.done)sets++;if(v&&v.kg&&v.reps)vol+=parseFloat(v.kg)*parseFloat(v.reps);});
  vol=Math.round(vol);
  document.getElementById("stats-grid").innerHTML=
    '<div class="scard"><div class="snum">'+total+'</div><div class="slbl">sesiones</div></div>'+
    '<div class="scard"><div class="snum">'+sets+'</div><div class="slbl">series hechas</div></div>'+
    '<div class="scard"><div class="snum">'+P.week+'</div><div class="slbl">semanas</div></div>'+
    '<div class="scard"><div class="snum">'+(vol>0?vol.toLocaleString("es-CL"):"&mdash;")+'</div><div class="slbl">kg volumen</div></div>';
  var prKeys=Object.keys(P.prs);var allPRs=[];
  for(var i=0;i<prKeys.length;i++){var ex=findEx(prKeys[i]);if(ex)allPRs.push({n:ex.n,kg:P.prs[prKeys[i]].kg,date:P.prs[prKeys[i]].date});}
  allPRs.sort(function(a,b){return b.kg-a.kg;});
  var html="";
  for(var i=0;i<allPRs.length;i++){
    html+='<div class="pr-item"><div class="pr-left"><div class="pr-n">'+allPRs[i].n+'</div><div class="pr-d">'+allPRs[i].date+'</div></div><div class="pr-v">'+allPRs[i].kg+' kg</div></div>';
  }
  document.getElementById("pr-list").innerHTML=html||'<div class="no-data">Registra pesos para ver tus records aqui.</div>';
}
</script>
</body>
</html>
